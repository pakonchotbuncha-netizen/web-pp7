<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📋 Copy ข้อมูลจำนวนสมาชิกย้อนหลัง</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
body { font-family: 'Sarabun', sans-serif; }
.copy-btn { transition: all 0.2s; }
.copy-btn:hover { transform: scale(1.05); }
.copy-btn:active { transform: scale(0.95); }
.copied { animation: pulse 0.5s ease; }
@keyframes pulse { 0%{transform:scale(1)} 50%{transform:scale(1.1)} 100%{transform:scale(1)} }
</style>
</head>
<body class="bg-slate-50 p-4">
<div class="max-w-4xl mx-auto">
  <h1 class="text-2xl font-bold text-slate-800 mb-2">📋 Copy ข้อมูลจำนวนสมาชิกย้อนหลัง</h1>
  <p class="text-sm text-slate-500 mb-4">กดปุ่ม Copy แล้ววาง (Ctrl+V) ลง Google Sheet ได้เลย</p>

  <!-- Copy All Button -->
  <div class="flex flex-wrap gap-3 mb-4">
    <button onclick="copyAll()" id="btnAll" class="copy-btn bg-indigo-600 text-white px-6 py-3 rounded-xl font-semibold text-lg shadow-lg hover:bg-indigo-700">
      📋 Copy ทั้งหมด (Tab-separated)
    </button>
    <button onclick="copyCSV()" id="btnCSV" class="copy-btn bg-emerald-600 text-white px-6 py-3 rounded-xl font-semibold shadow-lg hover:bg-emerald-700">
      📄 Copy แบบ CSV
    </button>
  </div>

  <!-- Preview -->
  <div class="bg-white rounded-xl shadow-md overflow-x-auto mb-4">
    <table class="w-full text-sm" id="previewTable">
      <thead class="bg-indigo-600 text-white">
        <tr id="headerRow"></tr>
      </thead>
      <tbody id="dataBody"></tbody>
    </table>
  </div>

  <!-- Status -->
  <div id="status" class="text-center text-green-600 font-semibold text-lg hidden">✅ Copy แล้ว! วางใน Google Sheet ได้เลย</div>
</div>

<script>
const headers = ['ปีพุทธศักราช','ปีคศ','AAMG','PMSG','PGHG','RPLC&RAFL','RAFCO&AICP','CPDG&LDC','TNRG','ADMC','21CT','KKK','อื่นๆ','รวม PKG','หมายเหตุ'];
const data = [
  ['Y2559',2016,204,191,77,31,0,0,0,0,0,7,0,510,'ข้อมูลจากชีตสมาชิกปี59'],
  ['Y2560',2017,206,193,71,31,0,0,0,0,0,7,0,508,'ข้อมูลจากชีตสมาชิกปี60'],
  ['Y2561',2018,219,242,68,55,5,0,1,17,4,1,16,628,'ข้อมูลจากชีตสมาชิกปี61'],
  ['Y2562',2019,178,196,76,53,29,15,0,17,4,2,0,570,'ข้อมูลจากชีตสมาชิกปี62'],
  ['Y2563',2020,176,180,73,53,29,15,0,17,4,0,0,547,'ข้อมูลจากชีตสมาชิกปี63'],
  ['Y2564',2021,168,203,55,46,56,0,0,16,0,0,40,584,'ข้อมูลจากชีตสมาชิกปี64'],
  ['Y2565',2022,139,213,53,41,56,0,0,16,0,0,41,559,'ข้อมูลจากชีตสมาชิกปี65'],
  ['Y2566',2023,0,166,0,0,0,0,1,16,0,0,0,183,'ข้อมูลจากชีตสมาชิกปี66'],
  ['Y2567',2024,125,253,2,28,33,51,0,1,5,0,0,498,'ข้อมูลจากชีตสมาชิกปี67'],
  ['Y2568',2025,50,262,0,25,24,7,4,0,2,0,142,516,'ข้อมูลจากชีตสมาชิกปี68'],
  ['Y2569',2026,172,58,0,0,0,45,0,16,6,0,6,303,'ข้อมูลจาก BCT ปัจจุบัน']
];

// Render preview table
const headerRow = document.getElementById('headerRow');
headers.forEach(h => {
  const th = document.createElement('th');
  th.textContent = h;
  th.className = 'px-3 py-2 text-center whitespace-nowrap border border-indigo-500';
  headerRow.appendChild(th);
});
const tbody = document.getElementById('dataBody');
data.forEach((row, i) => {
  const tr = document.createElement('tr');
  tr.className = i % 2 === 0 ? 'bg-slate-50' : 'bg-white';
  row.forEach((cell, j) => {
    const td = document.createElement('td');
    td.textContent = cell;
    td.className = 'px-3 py-2 text-center border border-slate-200';
    if (j === headers.length - 1) td.className += ' text-left text-xs text-slate-500';
    tr.appendChild(td);
  });
  tbody.appendChild(tr);
});

function buildTSV() {
  let tsv = headers.join('\t') + '\n';
  data.forEach(row => { tsv += row.join('\t') + '\n'; });
  return tsv;
}
function buildCSV() {
  let csv = headers.map(h => `"${h}"`).join(',') + '\n';
  data.forEach(row => { csv += row.map(c => typeof c === 'string' && c.includes(',') ? `"${c}"` : c).join(',') + '\n'; });
  return csv;
}

function copyAll() {
  navigator.clipboard.writeText(buildTSV()).then(() => showStatus('btnAll'));
}
function copyCSV() {
  navigator.clipboard.writeText(buildCSV()).then(() => showStatus('btnCSV'));
}
function showStatus(btnId) {
  const btn = document.getElementById(btnId);
  btn.classList.add('copied');
  setTimeout(() => btn.classList.remove('copied'), 500);
  document.getElementById('status').classList.remove('hidden');
  setTimeout(() => document.getElementById('status').classList.add('hidden'), 3000);
}
</script>
</body>
</html>
