        </div>

        // ===== INITIALIZATION =====
        document.addEventListener('DOMContentLoaded', () => {
            initializeDemoData();
            switchView('applicant');
        });

        // ===== INITIALIZE DEMO DATA =====
        function initializeDemoData() {
            const users = JSON.parse(localStorage.getItem('pkg_users') || '[]');
            if (!users.find(u => u.phone === '0812345678')) {
                users.push({
                    id: 'HR-DEMO',
                    phone: '0812345678',
                    password: btoa('hr1234'),
                    name: 'HR Manager',
                    email: 'hr@pkg.com',
                    role: 'hr',
                    createdAt: new Date().toISOString(),
                    status: 'active'
                });
            }
            if (!users.find(u => u.phone === '0898765432')) {
                users.push({
                    id: 'APP-DEMO',
                    phone: '0898765432',
                    password: btoa('app1234'),
                    name: 'นายสมชาย ใจดี',
                    email: 'somchai@test.com',
                    role: 'applicant',
                    createdAt: new Date().toISOString(),
                    status: 'active'
                });
            }
            localStorage.setItem('pkg_users', JSON.stringify(users));
        }

        // ===== SWITCH VIEW =====
        function switchView(view) {
            currentView = view;
            currentStep = 'positions';
            document.getElementById('view-applicant').className = view === 'applicant' ? 'view-active flex-1 py-3 rounded-lg font-semibold' : 'view-inactive flex-1 py-3 rounded-lg font-semibold';
            document.getElementById('view-hr').className = view === 'hr' ? 'view-active flex-1 py-3 rounded-lg font-semibold' : 'view-inactive flex-1 py-3 rounded-lg font-semibold';
            
            if (view === 'applicant') {
                renderApplicantView();
            } else {
                renderHRView();
            }
        }

        // ===== RENDER APPLICANT VIEW =====
        function renderApplicantView() {
            const content = document.getElementById('content-area');
            
            if (currentStep === 'positions') {
                renderPositionsList();
            } else if (currentStep === 'application') {
                renderApplicationForm();
            } else if (currentStep === 'result') {
                renderAIResult();
            }
        }

        // ===== STEP 1: POSITIONS LIST =====

            const content = document.getElementById('content-area');
            content.innerHTML = `

        // ===== SELECT POSITION =====

            const position = POSITIONS.find(p => p.id === positionId);
            if (position) {
                window.selectedPosition = position;
                currentStep = 'application';

        // ===== STEP 2: APPLICATION FORM =====
        function renderApplicationForm() {

            const pos = window.selectedPosition;

                    </h2>
                    <p class="text-gray-600 mb-6">ตำแหน่ง: <strong>${pos.title}</strong></p>
                    
                    <form onsubmit="submitApplication(event)">
                        <!-- ข้อมูลส่วนตัว -->

                            <h3 class="text-lg font-semibold text-gray-700 mb-4">
                                <i class="fas fa-user mr-2"></i>ข้อมูลส่วนตัว
                            </h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">ชื่อ <span class="text-red-500">*</span></label>
                                    <input type="text" id="app-firstname" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-600" placeholder="สมชาย">

                                    <input type="text" id="app-lastname" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-600" placeholder="ใจดี">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">เบอร์โทร <span class="text-red-500">*</span></label>
                                    <input type="tel" id="app-phone" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-600" placeholder="0812345678">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Email <span class="text-red-500">*</span></label>
                                    <input type="email" id="app-email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-600" placeholder="example@email.com">
                                </div>
                            </div>
                        </div>

                        <!-- การศึกษา -->

                            <h3 class="text-lg font-semibold text-gray-700 mb-4">
                                <i class="fas fa-graduation-cap mr-2"></i>การศึกษา
                            </h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">วุฒิการศึกษา <span class="text-red-500">*</span></label>
                                    <select id="app-education" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-600">
                                        <option value="">-- เลือก --</option>
                                        <option value="มัธยมศึกษา">มัธยมศึกษา</option>
                                        <option value="ปวส.">ปวส.</option>
                                        <option value="ปริญญาตรี">ปริญญาตรี</option>
                                        <option value="ปริญญาโท">ปริญญาโท</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">สาขาวิชา <span class="text-red-500">*</span></label>
                                    <input type="text" id="app-major" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-600" placeholder="วิทยาการคอมพิวเตอร์">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">GPA</label>
                                    <input type="number" step="0.01" min="0" max="4" id="app-gpa" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-600" placeholder="3.50">

                        </div>

                            </h3>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">ทักษะที่เกี่ยวข้องกับตำแหน่ง <span class="text-red-500">*</span></label>
                                <textarea id="app-skills" required rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-600" placeholder="เช่น JavaScript, React, Node.js"></textarea>

                            </div>
                        </div>

                        <!-- ประสบการณ์ -->
                        <div class="mb-6">

                                <i class="fas fa-briefcase mr-2"></i>ประสบการณ์ทำงาน
                            </h3>
                            <div>

                                <input type="number" min="0" id="app-experience" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-600" placeholder="0">

                            </div>
                            <div class="mt-4">
                                <label class="block text-sm font-medium text-gray-700 mb-2">รายละเอียดประสบการณ์</label>
                                <textarea id="app-experience-detail" rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-600" placeholder="อธิบายประสบการณ์ทำงานที่ผ่านมา"></textarea>

        // ===== BACK TO POSITIONS =====
        function backToPositions() {
            currentStep = 'positions';
            renderPositionsList();
        }

        // ===== SUBMIT APPLICATION =====
        function submitApplication(event) {
            event.preventDefault();
            
            const pos = window.selectedPosition;
            const formData = {
                firstname: document.getElementById('app-firstname').value,
                lastname: document.getElementById('app-lastname').value,
                phone: document.getElementById('app-phone').value,
                email: document.getElementById('app-email').value,
                education: document.getElementById('app-education').value,
                major: document.getElementById('app-major').value,
                gpa: document.getElementById('app-gpa').value,
                institution: document.getElementById('app-institution').value,
                skills: document.getElementById('app-skills').value,
                experience: document.getElementById('app-experience').value || '0',
                experienceDetail: document.getElementById('app-experience-detail').value
            };
            
            // AI Analysis
            const analysis = analyzeApplication(formData, pos);
            window.analysisResult = analysis;
            window.applicantData = formData;
            
            currentStep = 'result';
            renderAIResult();
        }

        // ===== AI ANALYSIS =====
        function analyzeApplication(formData, position) {
            let score = 0;
            let reasons = [];
            let suggestions = [];
            
            // Check education level
            const educationLevels = {
                'มัธยมศึกษา': 1,
                'ปวส.': 2,
                'ปริญญาตรี': 3,
                'ปริญญาโท': 4
            };
            
            const requiredLevel = position.requirements.education === 'ปวส. ขึ้นไป' ? 2 : 3;
            const applicantLevel = educationLevels[formData.education] || 0;
            
            if (applicantLevel >= requiredLevel) {
                score += 30;
                reasons.push('✅ วุฒิการศึกษาตรงกับข้อกำหนด');
            } else {
                reasons.push('❌ วุฒิการศึกษาไม่ตรงกับข้อกำหนด');
                suggestions.push('ต้องการวุฒิ ' + position.requirements.education);
            }
            
            // Check major
            const majorKeywords = position.requirements.major.toLowerCase().split(',').map(m => m.trim());
            const applicantMajor = formData.major.toLowerCase();
            const majorMatch = majorKeywords.some(keyword => applicantMajor.includes(keyword) || keyword.includes(applicantMajor));
            
            if (majorMatch || position.requirements.major.includes('ไม่จำกัด')) {
                score += 25;
                reasons.push('✅ สาขาวิชาตรงกับข้อกำหนด');
            } else {
                reasons.push('⚠️ สาขาวิชาไม่ตรงกับข้อกำหนดโดยตรง แต่สามารถพิจารณาได้');
                suggestions.push('สาขาที่ต้องการ: ' + position.requirements.major);
            }
            
            // Check skills
            const requiredSkills = position.requirements.skills.map(s => s.toLowerCase());
            const applicantSkills = formData.skills.toLowerCase().split(',').map(s => s.trim());
            const skillMatch = requiredSkills.filter(skill => applicantSkills.some(appSkill => appSkill.includes(skill)));
            
            if (skillMatch.length >= requiredSkills.length * 0.7) {
                score += 25;
                reasons.push('✅ มีทักษะที่ตรงกับข้อกำหนด (' + skillMatch.length + '/' + requiredSkills.length + ')');
            } else if (skillMatch.length > 0) {
                score += 15;
                reasons.push('⚠️ มีทักษะบางส่วนที่ตรงกับข้อกำหนด (' + skillMatch.length + '/' + requiredSkills.length + ')');
                suggestions.push('ทักษะที่ต้องการ: ' + position.requirements.skills.join(', '));
            } else {
                reasons.push('❌ ไม่มีทักษะที่ตรงกับข้อกำหนด');
                suggestions.push('ทักษะที่ต้องการ: ' + position.requirements.skills.join(', '));
            }
            
            // Check experience
            const expMatch = position.requirements.experience.includes('ไม่จำเป็น') || 
                            parseInt(formData.experience) >= parseInt(position.requirements.experience);
            
            if (expMatch) {
                score += 20;
                reasons.push('✅ มีประสบการณ์เพียงพอ');
            } else {
                score += 10;
                reasons.push('⚠️ ประสบการณ์น้อยกว่าที่ต้องการ แต่สามารถพัฒนาได้');
                suggestions.push('ประสบการณ์ที่ต้องการ: ' + position.requirements.experience);
            }
            
            // Determine if suitable
            const isSuitable = score >= 70;
            
            // Find alternative positions if not suitable
            let alternatives = [];
            if (!isSuitable) {
                alternatives = POSITIONS.filter(p => p.id !== position.id).map(p => {
                    const altScore = calculateAlternativeScore(formData, p);
                    return { ...p, matchScore: altScore };
                }).sort((a, b) => b.matchScore - a.matchScore).slice(0, 3);
            }
            
            return {
                score: score,
                isSuitable: isSuitable,
                reasons: reasons,
                suggestions: suggestions,
                alternatives: alternatives
            };
        }

        // ===== CALCULATE ALTERNATIVE SCORE =====
        function calculateAlternativeScore(formData, position) {
            let score = 0;
            
            const educationLevels = {
                'มัธยมศึกษา': 1,
                'ปวส.': 2,
                'ปริญญาตรี': 3,
                'ปริญญาโท': 4
            };
            
            const requiredLevel = position.requirements.education === 'ปวส. ขึ้นไป' ? 2 : 3;
            const applicantLevel = educationLevels[formData.education] || 0;
            
            if (applicantLevel >= requiredLevel) score += 30;
            
            const majorKeywords = position.requirements.major.toLowerCase().split(',').map(m => m.trim());
            const applicantMajor = formData.major.toLowerCase();
            if (majorKeywords.some(keyword => applicantMajor.includes(keyword)) || position.requirements.major.includes('ไม่จำกัด')) {
                score += 25;
            }
            
            const requiredSkills = position.requirements.skills.map(s => s.toLowerCase());
            const applicantSkills = formData.skills.toLowerCase().split(',').map(s => s.trim());
            const skillMatch = requiredSkills.filter(skill => applicantSkills.some(appSkill => appSkill.includes(skill)));
            score += (skillMatch.length / requiredSkills.length) * 25;
            
            if (position.requirements.experience.includes('ไม่จำเป็น') || parseInt(formData.experience) >= parseInt(position.requirements.experience)) {
                score += 20;
            }
            
            return Math.round(score);
        }
