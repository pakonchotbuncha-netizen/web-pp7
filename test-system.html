<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ทดสอบระบบ - PKG Recruitment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap');
        * { font-family: 'Prompt', sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .view-active { background: #667eea; color: white; }
        .view-inactive { background: #f3f4f6; color: #6b7280; }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <div class="gradient-bg text-white py-6">
        <div class="max-w-7xl mx-auto px-4">
            <h1 class="text-3xl font-bold mb-2">🧪 ทดสอบระบบ PKG Recruitment</h1>
            <p class="opacity-90">ทดสอบได้ทั้ง 2 มุมมองในหน้าเดียว พร้อมข้อมูลตัวอย่าง</p>
        </div>
    </div>

    <!-- View Switcher -->
    <div class="max-w-7xl mx-auto px-4 py-6">
        <div class="bg-white rounded-xl shadow-lg p-4 mb-6">
            <div class="flex space-x-4">
                <button onclick="switchView('applicant')" id="view-applicant" class="view-active flex-1 py-3 rounded-lg font-semibold">
                    <i class="fas fa-user mr-2"></i>มุมมองผู้สมัคร
                </button>
                <button onclick="switchView('hr')" id="view-hr" class="view-inactive flex-1 py-3 rounded-lg font-semibold">
                    <i class="fas fa-user-tie mr-2"></i>มุมมอง HR
                </button>
            </div>
        </div>

        <!-- Content Area -->
        <div id="content-area"></div>
    </div>

    <script>
        let currentView = 'applicant';

        // ===== INITIALIZATION =====
        document.addEventListener('DOMContentLoaded', () => {
            initializeDemoData();
            switchView('applicant');
        });

        // ===== INITIALIZE DEMO DATA =====
        function initializeDemoData() {
            const users = JSON.parse(localStorage.getItem('pkg_users') || '[]');
            if (!users.find(u => u.phone === '0812345678')) {
                users.push({
                    id: 'HR-DEMO',
                    phone: '0812345678',
                    password: btoa('hr1234'),
                    name: 'HR Manager',
                    email: 'hr@pkg.com',
                    role: 'hr',
                    createdAt: new Date().toISOString(),
                    status: 'active'
                });
            }
            if (!users.find(u => u.phone === '0898765432')) {
                users.push({
                    id: 'APP-DEMO',
                    phone: '0898765432',
                    password: btoa('app1234'),
                    name: 'นายสมชาย ใจดี',
                    email: 'somchai@test.com',
                    role: 'applicant',
                    createdAt: new Date().toISOString(),
                    status: 'active'
                });
            }
            localStorage.setItem('pkg_users', JSON.stringify(users));

            const applications = JSON.parse(localStorage.getItem('pkg_applications') || '[]');
            if (applications.length === 0) {
                applications.push({
                    id: 'APP-DEMO-001',
                    userId: 'APP-DEMO',
                    positionTitle: 'นักพัฒนาซอฟต์แวร์',
                    department: 'IT',
                    status: 'new',
                    appliedAt: new Date().toISOString(),
                    personalData: {
                        firstName: 'สมชาย',
                        lastName: 'ใจดี',
                        phone: '0898765432',
                        email: 'somchai@test.com'
                    }
                });
                localStorage.setItem('pkg_applications', JSON.stringify(applications));
            }
        }

        // ===== SWITCH VIEW =====
        function switchView(view) {
            currentView = view;
            document.getElementById('view-applicant').className = view === 'applicant' ? 'view-active flex-1 py-3 rounded-lg font-semibold' : 'view-inactive flex-1 py-3 rounded-lg font-semibold';
            document.getElementById('view-hr').className = view === 'hr' ? 'view-active flex-1 py-3 rounded-lg font-semibold' : 'view-inactive flex-1 py-3 rounded-lg font-semibold';
            
            if (view === 'applicant') {
                renderApplicantView();
            } else {
                renderHRView();
            }
        }

        // ===== RENDER APPLICANT VIEW =====
        function renderApplicantView() {
            const content = document.getElementById('content-area');
            const applications = JSON.parse(localStorage.getItem('pkg_applications') || '[]');
            const userApps = applications.filter(a => a.userId === 'APP-DEMO');
            
            content.innerHTML = `
                <div class="bg-white rounded-xl shadow-lg p-6">
                    <h2 class="text-2xl font-bold text-gray-800 mb-6">
                        <i class="fas fa-user text-purple-600 mr-2"></i>มุมมองผู้สมัคร
                    </h2>
                    
                    <div class="space-y-6">
                        <!-- Login Section -->
                        <div class="border border-gray-200 rounded-lg p-4">
                            <h3 class="font-semibold text-gray-700 mb-3">1. เข้าสู่ระบบ (ข้อมูลตัวอย่าง)</h3>
                            <div class="grid grid-cols-2 gap-4 mb-3">
                                <div>
                                    <label class="block text-sm text-gray-600 mb-1">เบอร์โทร</label>
                                    <input type="text" id="demo-phone" value="0898765432" class="w-full px-3 py-2 border rounded-lg">
                                </div>
                                <div>
                                    <label class="block text-sm text-gray-600 mb-1">รหัสผ่าน</label>
                                    <input type="password" id="demo-password" value="app1234" class="w-full px-3 py-2 border rounded-lg">
                                </div>
                            </div>
                            <button onclick="demoLogin()" class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700">
                                <i class="fas fa-sign-in-alt mr-1"></i>เข้าสู่ระบบ
                            </button>
                        </div>

                        <!-- Dashboard Preview -->
                        <div class="border border-gray-200 rounded-lg p-4">
                            <h3 class="font-semibold text-gray-700 mb-3">2. Dashboard ผู้สมัคร (จำลอง)</h3>
                            <div class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white p-6 rounded-lg mb-4">
                                <h4 class="text-xl font-bold mb-2">สวัสดี, นายสมชาย ใจดี!</h4>
                                <p class="opacity-90">ยินดีต้อนรับสู่ระบบรับสมัครงาน PKG Group</p>
                            </div>
                            
                            <div class="grid grid-cols-4 gap-4 mb-4">
                                <div class="bg-blue-50 p-4 rounded-lg text-center">
                                    <p class="text-2xl font-bold text-blue-600">${userApps.length}</p>
                                    <p class="text-xs text-gray-600">ใบสมัครทั้งหมด</p>
                                </div>
                                <div class="bg-orange-50 p-4 rounded-lg text-center">
                                    <p class="text-2xl font-bold text-orange-600">${userApps.filter(a => a.status === 'new').length}</p>
                                    <p class="text-xs text-gray-600">กำลังดำเนินการ</p>
                                </div>
                                <div class="bg-purple-50 p-4 rounded-lg text-center">
                                    <p class="text-2xl font-bold text-purple-600">0</p>
                                    <p class="text-xs text-gray-600">แบบทดสอบ</p>
                                </div>
                                <div class="bg-red-50 p-4 rounded-lg text-center">
                                    <p class="text-2xl font-bold text-red-600">0</p>
                                    <p class="text-xs text-gray-600">การแจ้งเตือน</p>
                                </div>
                            </div>

                            <h4 class="font-semibold text-gray-700 mb-3">📋 ใบสมัครของฉัน</h4>
                            ${userApps.map(app => `
                                <div class="border border-gray-200 rounded-lg p-4 mb-3">
                                    <div class="flex justify-between items-start mb-2">
                                        <div>
                                            <h5 class="font-semibold">${app.positionTitle}</h5>
                                            <p class="text-sm text-gray-500">สมัครเมื่อ: ${new Date(app.appliedAt).toLocaleDateString('th-TH')}</p>
                                        </div>
                                        <span class="px-3 py-1 bg-blue-100 text-blue-800 rounded-full text-sm">${getStatusText(app.status)}</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>

                        <!-- Demo Actions -->
                        <div class="border border-gray-200 rounded-lg p-4">
                            <h3 class="font-semibold text-gray-700 mb-3">3. ทดสอบการทำงาน</h3>
                            <div class="space-y-3">
                                <button onclick="demoApplyJob()" class="w-full bg-blue-600 text-white px-4 py-3 rounded-lg hover:bg-blue-700 text-left">
                                    <i class="fas fa-briefcase mr-2"></i>สมัครงานใหม่
                                </button>
                                <button onclick="demoTakeTest()" class="w-full bg-green-600 text-white px-4 py-3 rounded-lg hover:bg-green-700 text-left">
                                    <i class="fas fa-tasks mr-2"></i>ทำแบบทดสอบ
                                </button>
                                <button onclick="demoCheckStatus()" class="w-full bg-orange-600 text-white px-4 py-3 rounded-lg hover:bg-orange-700 text-left">
                                    <i class="fas fa-info-circle mr-2"></i>ตรวจสอบสถานะ
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // ===== RENDER HR VIEW =====
        function renderHRView() {
            const content = document.getElementById('content-area');
            const applications = JSON.parse(localStorage.getItem('pkg_applications') || '[]');
            
            content.innerHTML = `
                <div class="bg-white rounded-xl shadow-lg p-6">
                    <h2 class="text-2xl font-bold text-gray-800 mb-6">
                        <i class="fas fa-user-tie text-purple-600 mr-2"></i>มุมมอง HR
                    </h2>
                    
                    <div class="space-y-6">
                        <!-- Login Section -->
                        <div class="border border-gray-200 rounded-lg p-4">
                            <h3 class="font-semibold text-gray-700 mb-3">1. เข้าสู่ระบบ HR (ข้อมูลตัวอย่าง)</h3>
                            <div class="grid grid-cols-2 gap-4 mb-3">
                                <div>
                                    <label class="block text-sm text-gray-600 mb-1">เบอร์โทร</label>
                                    <input type="text" id="hr-phone" value="0812345678" class="w-full px-3 py-2 border rounded-lg">
                                </div>
                                <div>
                                    <label class="block text-sm text-gray-600 mb-1">รหัสผ่าน</label>
                                    <input type="password" id="hr-password" value="hr1234" class="w-full px-3 py-2 border rounded-lg">
                                </div>
                            </div>
                            <button onclick="demoHRLogin()" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">
                                <i class="fas fa-sign-in-alt mr-1"></i>เข้าสู่ระบบ HR
                            </button>
                        </div>

                        <!-- HR Dashboard Preview -->
                        <div class="border border-gray-200 rounded-lg p-4">
                            <h3 class="font-semibold text-gray-700 mb-3">2. HR Dashboard (จำลอง)</h3>
                            <div class="grid grid-cols-5 gap-4 mb-4">
                                <div class="bg-blue-50 p-4 rounded-lg text-center">
                                    <p class="text-2xl font-bold text-gray-800">${applications.length}</p>
                                    <p class="text-xs text-gray-600">ผู้สมัครทั้งหมด</p>
                                </div>
                                <div class="bg-blue-50 p-4 rounded-lg text-center">
                                    <p class="text-2xl font-bold text-blue-600">${applications.filter(a => a.status === 'new').length}</p>
                                    <p class="text-xs text-gray-600">ใหม่</p>
                                </div>
                                <div class="bg-purple-50 p-4 rounded-lg text-center">
                                    <p class="text-2xl font-bold text-purple-600">${applications.filter(a => a.status === 'test_done').length}</p>
                                    <p class="text-xs text-gray-600">ทำแบบทดสอบแล้ว</p>
                                </div>
                                <div class="bg-orange-50 p-4 rounded-lg text-center">
                                    <p class="text-2xl font-bold text-orange-600">${applications.filter(a => ['interview_scheduled', 'interview_confirmed'].includes(a.status)).length}</p>
                                    <p class="text-xs text-gray-600">กำลังสัมภาษณ์</p>
                                </div>
                                <div class="bg-green-50 p-4 rounded-lg text-center">
                                    <p class="text-2xl font-bold text-green-600">${applications.filter(a => a.status === 'hired').length}</p>
                                    <p class="text-xs text-gray-600">จ้างงาน</p>
                                </div>
                            </div>

                            <h4 class="font-semibold text-gray-700 mb-3">📋 ผู้สมัครใหม่</h4>
                            ${applications.filter(a => a.status === 'new').map(app => `
                                <div class="border border-gray-200 rounded-lg p-4 mb-3">
                                    <div class="flex justify-between items-start mb-2">
                                        <div>
                                            <h5 class="font-semibold">${app.personalData?.firstName || ''} ${app.personalData?.lastName || ''}</h5>
                                            <p class="text-sm text-gray-500">${app.positionTitle} | ${app.department}</p>
                                        </div>
                                        <span class="px-3 py-1 bg-blue-100 text-blue-800 rounded-full text-sm">ใหม่</span>
                                    </div>
                                    <div class="flex space-x-2">
                                        <button onclick="demoScreenApplicant('${app.id}')" class="px-3 py-1 bg-purple-600 text-white rounded-lg hover:bg-purple-700 text-sm">
                                            <i class="fas fa-check mr-1"></i>คัดกรอง
                                        </button>
                                        <button onclick="demoSendTest('${app.id}')" class="px-3 py-1 bg-green-600 text-white rounded-lg hover:bg-green-700 text-sm">
                                            <i class="fas fa-paper-plane mr-1"></i>ส่งแบบทดสอบ
                                        </button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>

                        <!-- Demo Actions -->
                        <div class="border border-gray-200 rounded-lg p-4">
                            <h3 class="font-semibold text-gray-700 mb-3">3. ทดสอบการทำงาน</h3>
                            <div class="space-y-3">
                                <button onclick="demoScheduleInterview()" class="w-full bg-orange-600 text-white px-4 py-3 rounded-lg hover:bg-orange-700 text-left">
                                    <i class="fas fa-calendar-check mr-2"></i>นัดสัมภาษณ์
                                </button>
                                <button onclick="demoFinalizeResult()" class="w-full bg-green-600 text-white px-4 py-3 rounded-lg hover:bg-green-700 text-left">
                                    <i class="fas fa-award mr-2"></i>สรุปผล (ผ่าน)
                                </button>
                                <button onclick="demoOnboard()" class="w-full bg-indigo-600 text-white px-4 py-3 rounded-lg hover:bg-indigo-700 text-left">
                                    <i class="fas fa-handshake mr-2"></i>นัดเริ่มงาน
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // ===== DEMO FUNCTIONS =====
        function demoLogin() {
            const phone = document.getElementById('demo-phone').value;
            const password = document.getElementById('demo-password').value;
            
            const users = JSON.parse(localStorage.getItem('pkg_users') || '[]');
            const user = users.find(u => u.phone === phone && u.password === btoa(password));
            
            if (user) {
                alert(`✅ เข้าสู่ระบบสำเร็จ!\n\nชื่อ: ${user.name}\nบทบาท: ${user.role === 'applicant' ? 'ผู้สมัคร' : 'HR'}`);
            } else {
                alert('❌ เบอร์โทรหรือรหัสผ่านไม่ถูกต้อง');
            }
        }

        function demoHRLogin() {
            const phone = document.getElementById('hr-phone').value;
            const password = document.getElementById('hr-password').value;
            
            const users = JSON.parse(localStorage.getItem('pkg_users') || '[]');
            const user = users.find(u => u.phone === phone && u.password === btoa(password));
            
            if (user && user.role === 'hr') {
                alert(`✅ เข้าสู่ระบบ HR สำเร็จ!\n\nชื่อ: ${user.name}\nบทบาท: HR Manager`);
            } else {
                alert('❌ เบอร์โทรหรือรหัสผ่านไม่ถูกต้อง หรือไม่มีสิทธิ์ HR');
            }
        }

        function demoApplyJob() {
            alert('✅ สมัครงานสำเร็จ!\n\nตำแหน่ง: นักพัฒนาซอฟต์แวร์\nสถานะ: ใบสมัครใหม่');
        }

        function demoTakeTest() {
            alert('✅ เริ่มทำแบบทดสอบ!\n\nแบบทดสอบ 4 ชุด:\n1. ทัศนคติ (15 ข้อ)\n2. ทักษะ (15 ข้อ)\n3. CC 7 ด้าน (20 ข้อ)\n4. 3E3P (15 ข้อ)\n\nเวลาทั้งหมด: 45 นาที');
        }

        function demoCheckStatus() {
            const applications = JSON.parse(localStorage.getItem('pkg_applications') || '[]');
            const app = applications.find(a => a.userId === 'APP-DEMO');
            if (app) {
                alert(`📋 สถานะใบสมัคร:\n\nตำแหน่ง: ${app.positionTitle}\nสถานะ: ${getStatusText(app.status)}\nสมัครเมื่อ: ${new Date(app.appliedAt).toLocaleDateString('th-TH')}`);
            }
        }

        function demoScreenApplicant(appId) {
            const applications = JSON.parse(localStorage.getItem('pkg_applications') || '[]');
            const app = applications.find(a => a.id === appId);
            
            if (app) {
                app.status = 'screened';
                localStorage.setItem('pkg_applications', JSON.stringify(applications));
                alert('✅ คัดกรองผู้สมัครแล้ว!\n\nสถานะ: คัดกรองแล้ว');
                switchView('hr');
            }
        }

        function demoSendTest(appId) {
            const applications = JSON.parse(localStorage.getItem('pkg_applications') || '[]');
            const app = applications.find(a => a.id === appId);
            
            if (app) {
                app.status = 'test_sent';
                localStorage.setItem('pkg_applications', JSON.stringify(applications));
                alert('✅ ส่งแบบทดสอบให้ผู้สมัครแล้ว!\n\nสถานะ: ส่งแบบทดสอบแล้ว');
                switchView('hr');
            }
        }

        function demoScheduleInterview() {
            const applications = JSON.parse(localStorage.getItem('pkg_applications') || '[]');
            const app = applications.find(a => a.userId === 'APP-DEMO');
            
            if (app) {
                app.status = 'interview_scheduled';
                app.interviewDate = '25/07/2569';
                app.interviewTime = '10:00 น.';
                localStorage.setItem('pkg_applications', JSON.stringify(applications));
                alert('✅ นัดสัมภาษณ์แล้ว!\n\nวันที่: 25/07/2569\nเวลา: 10:00 น.\nสถานที่: สำนักงานใหญ่ PKG');
                switchView('hr');
            }
        }

        function demoFinalizeResult() {
            const applications = JSON.parse(localStorage.getItem('pkg_applications') || '[]');
            const app = applications.find(a => a.userId === 'APP-DEMO');
            
            if (app) {
                app.status = 'hired';
                localStorage.setItem('pkg_applications', JSON.stringify(applications));
                alert('✅ สรุปผล: ผ่าน!\n\nยินดีด้วย! คุณได้รับเลือกเข้าทำงาน');
                switchView('hr');
            }
        }

        function demoOnboard() {
            const applications = JSON.parse(localStorage.getItem('pkg_applications') || '[]');
            const app = applications.find(a => a.userId === 'APP-DEMO');
            
            if (app && app.status === 'hired') {
                app.startDate = '01/08/2569';
                localStorage.setItem('pkg_applications', JSON.stringify(applications));
                alert('✅ นัดเริ่มงานแล้ว!\n\nวันเริ่มงาน: 01/08/2569\nเวลา: 09:00 น.\nสถานที่: สำนักงานใหญ่ PKG');
                switchView('hr');
            } else {
                alert('❌ กรุณาสรุปผลก่อน');
            }
        }

        function getStatusText(status) {
            const statuses = {
                'new': 'ใบสมัครใหม่',
                'screened': 'คัดกรองแล้ว',
                'test_sent': 'ส่งแบบทดสอบแล้ว',
                'test_done': 'ทำแบบทดสอบเสร็จ',
                'interview_scheduled': 'นัดสัมภาษณ์',
                'interview_confirmed': 'ยืนยันการสัมภาษณ์',
                'interviewed': 'สัมภาษณ์แล้ว',
                'hired': 'จ้างงาน',
                'rejected': 'ไม่ผ่าน'
            };
            return statuses[status] || status;
        }
    </script>
</body>
</html>
