        function analyzeApplication(formData, position) {
            let score = 0, reasons = [], suggestions = [];
            const educationLevels = { 'มัธยมศึกษา': 1, 'ปวส.': 2, 'ปริญญาตรี': 3, 'ปริญญาโท': 4 };
            const requiredLevel = position.requirements.education === 'ปวส. ขึ้นไป' ? 2 : 3;
            const applicantLevel = educationLevels[formData.education] || 0;
            
            if (applicantLevel >= requiredLevel) { score += 30; reasons.push('✅ วุฒิการศึกษาตรงกับข้อกำหนด'); }
            else { reasons.push(' วุฒิการศึกษาไม่ตรงกับข้อกำหนด'); suggestions.push('ต้องการวุฒิ ' + position.requirements.education); }
            
            const majorKeywords = position.requirements.major.toLowerCase().split(',').map(m => m.trim());
            const applicantMajor = formData.major.toLowerCase();
            const majorMatch = majorKeywords.some(keyword => applicantMajor.includes(keyword) || keyword.includes(applicantMajor));
            
            if (majorMatch || position.requirements.major.includes('ไม่จำกัด')) { score += 25; reasons.push('✅ สาขาวิชาตรงกับข้อกำหนด'); }
            else { reasons.push('⚠️ สาขาวิชาไม่ตรงกับข้อกำหนดโดยตรง'); suggestions.push('สาขาที่ต้องการ: ' + position.requirements.major); }
            
            const requiredSkills = position.requirements.skills.map(s => s.toLowerCase());
            const applicantSkills = formData.skills.toLowerCase().split(',').map(s => s.trim());
            const skillMatch = requiredSkills.filter(skill => applicantSkills.some(appSkill => appSkill.includes(skill)));
            
            if (skillMatch.length >= requiredSkills.length * 0.7) { score += 25; reasons.push('✅ มีทักษะที่ตรงกับข้อกำหนด (' + skillMatch.length + '/' + requiredSkills.length + ')'); }
            else if (skillMatch.length > 0) { score += 15; reasons.push('⚠️ มีทักษะบางส่วน (' + skillMatch.length + '/' + requiredSkills.length + ')'); suggestions.push('ทักษะที่ต้องการ: ' + position.requirements.skills.join(', ')); }
            else { reasons.push('❌ ไม่มีทักษะที่ตรงกับข้อกำหนด'); suggestions.push('ทักษะที่ต้องการ: ' + position.requirements.skills.join(', ')); }
            
            const expMatch = position.requirements.experience.includes('ไม่จำเป็น') || parseInt(formData.experience) >= parseInt(position.requirements.experience);
            if (expMatch) { score += 20; reasons.push('✅ มีประสบการณ์เพียงพอ'); }
            else { score += 10; reasons.push('⚠️ ประสบการณ์น้อยกว่าที่ต้องการ'); suggestions.push('ประสบการณ์ที่ต้องการ: ' + position.requirements.experience); }
            
            const isSuitable = score >= 70;
            let alternatives = [];
            if (!isSuitable) {
                alternatives = POSITIONS.filter(p => p.id !== position.id).map(p => ({ ...p, matchScore: calculateAlternativeScore(formData, p) })).sort((a, b) => b.matchScore - a.matchScore).slice(0, 3);
            }
            return { score, isSuitable, reasons, suggestions, alternatives };
        }

        function calculateAlternativeScore(formData, position) {
            let score = 0;
            const educationLevels = { 'มัธยมศึกษา': 1, 'ปวส.': 2, 'ปริญญาตรี': 3, 'ปริญญาโท': 4 };
            const requiredLevel = position.requirements.education === 'ปวส. ขึ้นไป' ? 2 : 3;
            if ((educationLevels[formData.education] || 0) >= requiredLevel) score += 30;
            const majorKeywords = position.requirements.major.toLowerCase().split(',').map(m => m.trim());
            if (majorKeywords.some(keyword => formData.major.toLowerCase().includes(keyword)) || position.requirements.major.includes('ไม่จำกัด')) score += 25;
            const requiredSkills = position.requirements.skills.map(s => s.toLowerCase());
            const applicantSkills = formData.skills.toLowerCase().split(',').map(s => s.trim());
            const skillMatch = requiredSkills.filter(skill => applicantSkills.some(appSkill => appSkill.includes(skill)));
            score += (skillMatch.length / requiredSkills.length) * 25;
            if (position.requirements.experience.includes('ไม่จำเป็น') || parseInt(formData.experience) >= parseInt(position.requirements.experience)) score += 20;
            return Math.round(score);
        }

                            <div class="grid grid-cols-5 gap-4 mb-4">
                                <div class="bg-blue-50 p-4 rounded-lg text-center"><p class="text-2xl font-bold text-gray-800">${applications.length}</p><p class="text-xs text-gray-600">ผู้สมัครทั้งหมด</p></div>
                                <div class="bg-blue-50 p-4 rounded-lg text-center"><p class="text-2xl font-bold text-blue-600">${applications.filter(a => a.status === 'new').length}</p><p class="text-xs text-gray-600">ใหม่</p></div>
                                <div class="bg-purple-50 p-4 rounded-lg text-center"><p class="text-2xl font-bold text-purple-600">${applications.filter(a => a.status === 'test_done').length}</p><p class="text-xs text-gray-600">ทำแบบทดสอบแล้ว</p></div>
                                <div class="bg-orange-50 p-4 rounded-lg text-center"><p class="text-2xl font-bold text-orange-600">${applications.filter(a => ['interview_scheduled', 'interview_confirmed'].includes(a.status)).length}</p><p class="text-xs text-gray-600">กำลังสัมภาษณ์</p></div>
                                <div class="bg-green-50 p-4 rounded-lg text-center"><p class="text-2xl font-bold text-green-600">${applications.filter(a => a.status === 'hired').length}</p><p class="text-xs text-gray-600">จ้างงาน</p></div>
                            </div>
                            <h4 class="font-semibold text-gray-700 mb-3"> ผู้สมัครใหม่</h4>
                            ${applications.filter(a => a.status === 'new').map(app => `
                                <div class="border border-gray-200 rounded-lg p-4 mb-3">
                                    <div class="flex justify-between items-start mb-2">
                                        <div><h5 class="font-semibold">${app.personalData?.firstName || ''} ${app.personalData?.lastName || ''}</h5><p class="text-sm text-gray-500">${app.positionTitle} | ${app.department}</p></div>
                                        <span class="px-3 py-1 bg-blue-100 text-blue-800 rounded-full text-sm">ใหม่</span>
                                    </div>
                                    <div class="flex space-x-2">
                                        <button onclick="demoScreenApplicant('${app.id}')" class="px-3 py-1 bg-purple-600 text-white rounded-lg hover:bg-purple-700 text-sm"><i class="fas fa-check mr-1"></i>คัดกรอง</button>
                                        <button onclick="demoSendTest('${app.id}')" class="px-3 py-1 bg-green-600 text-white rounded-lg hover:bg-green-700 text-sm"><i class="fas fa-paper-plane mr-1"></i>ส่งแบบทดสอบ</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>

                        <div class="border border-gray-200 rounded-lg p-4">
                            <h3 class="font-semibold text-gray-700 mb-3">3. ทดสอบการทำงาน</h3>
                            <div class="space-y-3">
                                <button onclick="demoScheduleInterview()" class="w-full bg-orange-600 text-white px-4 py-3 rounded-lg hover:bg-orange-700 text-left"><i class="fas fa-calendar-check mr-2"></i>นัดสัมภาษณ์</button>
                                <button onclick="demoFinalizeResult()" class="w-full bg-green-600 text-white px-4 py-3 rounded-lg hover:bg-green-700 text-left"><i class="fas fa-award mr-2"></i>สรุปผล (ผ่าน)</button>
                                <button onclick="demoOnboard()" class="w-full bg-indigo-600 text-white px-4 py-3 rounded-lg hover:bg-indigo-700 text-left"><i class="fas fa-handshake mr-2"></i>นัดเริ่มงาน</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function demoHRLogin() { const phone = document.getElementById('hr-phone').value; const password = document.getElementById('hr-password').value; const users = JSON.parse(localStorage.getItem('pkg_users') || '[]'); const user = users.find(u => u.phone === phone && u.password === btoa(password)); if (user && user.role === 'hr') alert(`✅ เข้าสู่ระบบ HR สำเร็จ!\n\nชื่อ: ${user.name}\nบทบาท: HR Manager`); else alert('❌ เบอร์โทรหรือรหัสผ่านไม่ถูกต้อง'); }
        function demoScreenApplicant(appId) { const applications = JSON.parse(localStorage.getItem('pkg_applications') || '[]'); const app = applications.find(a => a.id === appId); if (app) { app.status = 'screened'; localStorage.setItem('pkg_applications', JSON.stringify(applications)); alert('✅ คัดกรองผู้สมัครแล้ว!'); switchView('hr'); } }
        function demoSendTest(appId) { const applications = JSON.parse(localStorage.getItem('pkg_applications') || '[]'); const app = applications.find(a => a.id === appId); if (app) { app.status = 'test_sent'; localStorage.setItem('pkg_applications', JSON.stringify(applications)); alert('✅ ส่งแบบทดสอบให้ผู้สมัครแล้ว!'); switchView('hr'); } }
        function demoScheduleInterview() { const applications = JSON.parse(localStorage.getItem('pkg_applications') || '[]'); const app = applications.find(a => a.userId === 'APP-DEMO'); if (app) { app.status = 'interview_scheduled'; app.interviewDate = '25/07/2569'; app.interviewTime = '10:00 น.'; localStorage.setItem('pkg_applications', JSON.stringify(applications)); alert('✅ นัดสัมภาษณ์แล้ว!\n\nวันที่: 25/07/2569\nเวลา: 10:00 น.'); switchView('hr'); } }
        function demoFinalizeResult() { const applications = JSON.parse(localStorage.getItem('pkg_applications') || '[]'); const app = applications.find(a => a.userId === 'APP-DEMO'); if (app) { app.status = 'hired'; localStorage.setItem('pkg_applications', JSON.stringify(applications)); alert('✅ สรุปผล: ผ่าน!'); switchView('hr'); } }
        function demoOnboard() { const applications = JSON.parse(localStorage.getItem('pkg_applications') || '[]'); const app = applications.find(a => a.userId === 'APP-DEMO'); if (app && app.status === 'hired') { app.startDate = '01/08/2569'; localStorage.setItem('pkg_applications', JSON.stringify(applications)); alert('✅ นัดเริ่มงานแล้ว!\n\nวันเริ่มงาน: 01/08/2569'); switchView('hr'); } else alert('❌ กรุณาสรุปผลก่อน'); }
    </script>
</body>
</html>
