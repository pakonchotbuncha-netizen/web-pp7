<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ใบสมัครงาน - Application Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Noto+Sans+Lao:wght@300;400;500;600;700&family=Noto+Sans+Khmer:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Prompt', sans-serif; }
        body[data-lang="lo"] { font-family: 'Noto Sans Lao', sans-serif; }
        body[data-lang="km"] { font-family: 'Noto Sans Khmer', sans-serif; }
        .lang-btn { transition: all 0.2s; }
        .lang-btn.active { background: #3b82f6; color: white; }
    </style>
</head>
<body class="bg-gray-50" data-lang="th">
    <!-- Language Selector -->
    <div class="fixed top-4 right-4 z-50 bg-white rounded-lg shadow-lg p-2 flex gap-2">
        <button onclick="setLanguage('th')" id="lang-th" class="lang-btn active px-3 py-1 rounded text-sm font-medium">🇹🇭 ไทย</button>
        <button onclick="setLanguage('en')" id="lang-en" class="lang-btn px-3 py-1 rounded text-sm font-medium bg-gray-200 text-gray-700 hover:bg-gray-300">🇬🇧 EN</button>
        <button onclick="setLanguage('lo')" id="lang-lo" class="lang-btn px-3 py-1 rounded text-sm font-medium bg-gray-200 text-gray-700 hover:bg-gray-300">🇱🇦 ລາວ</button>
        <button onclick="setLanguage('km')" id="lang-km" class="lang-btn px-3 py-1 rounded text-sm font-medium bg-gray-200 text-gray-700 hover:bg-gray-300">🇰🇭 ខ្មែរ</button>
    </div>

    <div class="max-w-4xl mx-auto px-4 py-8">
        <!-- Header -->
        <div class="bg-gradient-to-r from-blue-600 to-purple-600 text-white rounded-xl shadow-lg p-8 mb-6">
            <h1 class="text-3xl font-bold mb-2" id="page-title">ใบสมัครงาน</h1>
            <p class="text-blue-100" id="page-subtitle">กรุณากรอกข้อมูลให้ครบถ้วน</p>
        </div>

        <!-- PDPA Consent Section -->
        <div class="bg-white rounded-xl shadow-lg p-6 mb-6">
            <div class="prose max-w-none" id="consent-content">
                <!-- Content will be loaded dynamically -->
            </div>

            <!-- Consent Buttons -->
            <div class="mt-6 flex gap-4 justify-center">
                <button onclick="handleConsent(true)" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-8 rounded-lg transition">
                    <span id="btn-agree">ยินยอม</span>
                </button>
                <button onclick="handleConsent(false)" class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-8 rounded-lg transition">
                    <span id="btn-disagree">ไม่ยินยอม</span>
                </button>
            </div>
        </div>

        <!-- Application Form (shown after consent) -->
        <div id="application-form" class="hidden">
            <div class="bg-white rounded-xl shadow-lg p-6 mb-6">
                <h2 class="text-2xl font-bold text-gray-800 mb-6" id="form-title">ข้อมูลผู้สมัคร</h2>
                
                <form id="registerForm" class="space-y-6">
                    <!-- Section 1: ข้อมูลส่วนตัว -->
                    <div class="bg-blue-50 p-4 rounded-lg">
                        <h3 class="font-semibold text-blue-800 mb-4">📋 ข้อมูลส่วนตัว</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2" id="label-firstname">ชื่อ *</label>
                                <input type="text" name="firstname" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2" id="label-lastname">นามสกุล *</label>
                                <input type="text" name="lastname" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2" id="label-nickname">ชื่อเล่น</label>
                                <input type="text" name="nickname" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2" id="label-gender">เพศ *</label>
                                <select name="gender" id="gender-select" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                                    <option value="">-- เลือก --</option>
                                    <option value="male">ชาย</option>
                                    <option value="female">หญิง</option>
                                    <option value="other">อื่นๆ</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2" id="label-birthdate">วัน/เดือน/ปี เกิด *</label>
                                <input type="date" name="birthdate" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2" id="label-email">อีเมล *</label>
                                <input type="email" name="email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2" id="label-phone">เบอร์โทรศัพท์ *</label>
                                <input type="tel" name="phone" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                            </div>
                        </div>

                        <div class="mt-4">
                            <label class="block text-sm font-medium text-gray-700 mb-2" id="label-address">ที่อยู่ *</label>
                            <textarea name="address" rows="2" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"></textarea>
                        </div>
                    </div>

                    <!-- Section 2: ตำแหน่งและประสบการณ์ -->
                    <div class="bg-green-50 p-4 rounded-lg">
                        <h3 class="font-semibold text-green-800 mb-4"> ตำแหน่งและประสบการณ์</h3>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2" id="label-position">ตำแหน่งที่สมัคร *</label>
                            <input type="text" name="position" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                        </div>

                        <div class="mt-4">
                            <label class="block text-sm font-medium text-gray-700 mb-2" id="label-experience">ประสบการณ์ทำงาน *</label>
                            <textarea name="experience" rows="4" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="ระบุบริษัท ตำแหน่ง ระยะเวลา และหน้าที่รับผิดชอบ"></textarea>
                        </div>

                        <div class="mt-4">
                            <label class="block text-sm font-medium text-gray-700 mb-2" id="label-education">การศึกษา *</label>
                            <textarea name="education" rows="3" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="ระบุระดับการศึกษา สถาบัน สาขาวิชา"></textarea>
                        </div>

                        <div class="mt-4">
                            <label class="block text-sm font-medium text-gray-700 mb-2" id="label-license">ใบอนุญาตประกอบวิชาชีพ</label>
                            <input type="text" name="license" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="ถ้ามี">
                        </div>
                    </div>

                    <!-- Section 3: ผู้ติดต่อฉุกเฉินและบุคคลอ้างอิง -->
                    <div class="bg-orange-50 p-4 rounded-lg">
                        <h3 class="font-semibold text-orange-800 mb-4">🚨 ผู้ติดต่อกรณีฉุกเฉิน</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2" id="label-emergency-name">ชื่อ-นามสกุล *</label>
                                <input type="text" name="emergency_name" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2" id="label-emergency-phone">เบอร์โทรศัพท์ *</label>
                                <input type="tel" name="emergency_phone" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                            </div>
                        </div>

                        <h3 class="font-semibold text-orange-800 mb-4 mt-6">👥 บุคคลอ้างอิง</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2" id="label-reference-name">ชื่อ-นามสกุล</label>
                                <input type="text" name="reference_name" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2" id="label-reference-phone">เบอร์โทรศัพท์</label>
                                <input type="tel" name="reference_phone" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                            </div>
                        </div>
                    </div>

                    <!-- Section 4: อัพโหลดเอกสาร -->
                    <div class="bg-purple-50 p-4 rounded-lg">
                        <h3 class="font-semibold text-purple-800 mb-4"> อัพโหลดเอกสาร</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2" id="label-resume">Resume/CV *</label>
                                <input type="file" name="resume" accept=".pdf,.doc,.docx" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                                <p class="text-xs text-gray-500 mt-1">รองรับ PDF, DOC, DOCX (สูงสุด 5MB)</p>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2" id="label-photo">รูปถ่าย *</label>
                                <input type="file" name="photo" accept="image/*" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                                <p class="text-xs text-gray-500 mt-1">รองรับ JPG, PNG (สูงสุด 2MB)</p>
                            </div>
                        </div>
                    </div>

                    <!-- Submit Buttons -->
                    <div class="flex justify-center gap-4 pt-4">
                        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg transition">
                            <span id="btn-submit">ส่งใบสมัคร</span>
                        </button>
                        <button type="reset" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-3 px-8 rounded-lg transition">
                            <span id="btn-reset">ล้างข้อมูล</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        let currentLang = 'th';
        let translations = {};

        // Load translation files
        async function loadTranslations(lang) {
            try {
                const response = await fetch(`i18n/form-register-${lang}.json`);
                translations[lang] = await response.json();
                return translations[lang];
            } catch (error) {
                console.error(`Error loading ${lang} translation:`, error);
                return null;
            }
        }

        // Set language
        async function setLanguage(lang) {
            currentLang = lang;
            document.body.setAttribute('data-lang', lang);
            
            // Update button styles
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active', 'bg-blue-600', 'text-white');
                btn.classList.add('bg-gray-200', 'text-gray-700');
            });
            document.getElementById(`lang-${lang}`).classList.add('active', 'bg-blue-600', 'text-white');
            document.getElementById(`lang-${lang}`).classList.remove('bg-gray-200', 'text-gray-700');

            // Load and render content
            const data = await loadTranslations(lang);
            if (data) {
                renderContent(data);
            }
        }

        // Render content
        function renderContent(data) {
            // Update page title
            document.getElementById('page-title').textContent = data.pageTitle || 'ใบสมัครงาน';
            document.getElementById('page-subtitle').textContent = data.pageSubtitle || 'กรุณากรอกข้อมูลให้ครบถ้วน';

            // Build consent content
            let html = '';
            
            // Companies and intro
            html += `<p class="text-sm text-gray-700 mb-4">${data.companies} ${data.intro}</p>`;

            // Sections
            data.sections.forEach(section => {
                html += `<h3 class="text-lg font-bold text-gray-800 mt-6 mb-3">${section.title}</h3>`;
                html += `<p class="text-sm text-gray-700 mb-2">${section.content}</p>`;
                
                if (section.items && section.items.length > 0) {
                    html += '<ol class="list-decimal list-inside space-y-2 text-sm text-gray-700 ml-4">';
                    section.items.forEach(item => {
                        html += `<li>${item}</li>`;
                    });
                    html += '</ol>';
                }
            });

            // Consent text
            html += `<p class="text-sm text-gray-700 mt-6 font-semibold">${data.consent}</p>`;
            html += `<p class="text-sm text-gray-700 mt-2">${data.consentAgree}</p>`;

            document.getElementById('consent-content').innerHTML = html;

            // Update buttons
            document.getElementById('btn-agree').textContent = data.buttons.agree;
            document.getElementById('btn-disagree').textContent = data.buttons.disagree;

            // Update form labels
            document.getElementById('form-title').textContent = data.formTitle || 'ข้อมูลผู้สมัคร';
            document.getElementById('label-firstname').textContent = data.labels?.firstname || 'ชื่อ';
            document.getElementById('label-lastname').textContent = data.labels?.lastname || 'นามสกุล';
            document.getElementById('label-nickname').textContent = data.labels?.nickname || 'ชื่อเล่น';
            document.getElementById('label-gender').textContent = data.labels?.gender || 'เพศ';
            document.getElementById('label-birthdate').textContent = data.labels?.birthdate || 'วัน/เดือน/ปี เกิด';
            document.getElementById('label-email').textContent = data.labels?.email || 'อีเมล';
            document.getElementById('label-phone').textContent = data.labels?.phone || 'เบอร์โทรศัพท์';
            document.getElementById('label-address').textContent = data.labels?.address || 'ที่อยู่';
            document.getElementById('label-position').textContent = data.labels?.position || 'ตำแหน่งที่สมัคร';
            document.getElementById('label-experience').textContent = data.labels?.experience || 'ประสบการณ์ทำงาน';
            document.getElementById('label-education').textContent = data.labels?.education || 'การศึกษา';
            document.getElementById('label-license').textContent = data.labels?.license || 'ใบอนุญาตประกอบวิชาชีพ';
            document.getElementById('label-emergency-name').textContent = data.labels?.emergency_name || 'ชื่อผู้ติดต่อกรณีฉุกเฉิน';
            document.getElementById('label-emergency-phone').textContent = data.labels?.emergency_phone || 'เบอร์โทรศัพท์ผู้ติดต่อฉุกเฉิน';
            document.getElementById('label-reference-name').textContent = data.labels?.reference_name || 'ชื่อบุคคลอ้างอิง';
            document.getElementById('label-reference-phone').textContent = data.labels?.reference_phone || 'เบอร์โทรศัพท์บุคคลอ้างอิง';
            document.getElementById('label-resume').textContent = data.labels?.resume || 'อัพโหลด Resume/CV';
            document.getElementById('label-photo').textContent = data.labels?.photo || 'อัพโหลดรูปถ่าย';
            document.getElementById('btn-submit').textContent = data.buttons?.submit || 'ส่งใบสมัคร';
            document.getElementById('btn-reset').textContent = data.buttons?.reset || 'ล้างข้อมูล';

            // Update gender options
            if (data.genderOptions) {
                const genderSelect = document.getElementById('gender-select');
                if (genderSelect) {
                    const currentVal = genderSelect.value;
                    genderSelect.innerHTML = `
                        <option value="">${data.genderOptions.placeholder}</option>
                        <option value="male">${data.genderOptions.male}</option>
                        <option value="female">${data.genderOptions.female}</option>
                        <option value="other">${data.genderOptions.other}</option>
                    `;
                    genderSelect.value = currentVal;
                }
            }
        }

        // Handle consent
        function handleConsent(agreed) {
            if (agreed) {
                document.getElementById('application-form').classList.remove('hidden');
                document.getElementById('application-form').scrollIntoView({ behavior: 'smooth' });
            } else {
                alert(currentLang === 'th' ? 'คุณต้องยินยอมเพื่อสมัครงาน' : 
                      currentLang === 'lo' ? 'ທ່ານຕ້ອງຍິນຍອມເພື່ອສະໝັກວຽກ' : 
                      'អ្នកត្រូវយល់ព្រមដើម្បីដាក់ពាក្យសុំការងារ');
            }
        }

        // Form submission
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const data = Object.fromEntries(formData);
            
            // Here you would send the data to your backend
            console.log('Form data:', data);
            
            alert(currentLang === 'th' ? 'ส่งใบสมัครสำเร็จ!' : 
                  currentLang === 'lo' ? 'ສົ່ງໃບສະໝັກສຳເລັດ!' : 
                  'ដាក់ពាក្យសុំការងារបានជោគជ័យ!');
        });

        // Initialize with Thai
        setLanguage('th');
    </script>
</body>
</html>
