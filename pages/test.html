<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบทดสอบ - PKG Recruitment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap');
        * { font-family: 'Prompt', sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .progress-bar { transition: width 0.3s ease; }
        .option-card { transition: all 0.2s ease; }
        .option-card:hover { transform: translateX(5px); }
        .option-card.selected { background: #667eea; color: white; border-color: #667eea; }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <i class="fas fa-building text-purple-600 text-2xl mr-3"></i>
                    <span class="font-bold text-xl text-gray-800">PKG Recruitment</span>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="text-sm text-gray-600">
                        <i class="fas fa-clock mr-1"></i>เวลาเหลือ: <span id="timer" class="font-semibold text-red-600">45:00</span>
                    </div>
                    <button onclick="saveProgress()" class="bg-gray-300 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-400 transition">
                        <i class="fas fa-save mr-1"></i>บันทึกความคืบหน้า
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Progress Bar -->
    <div class="bg-white border-b">
        <div class="max-w-4xl mx-auto px-4 py-4">
            <div class="flex justify-between items-center mb-2">
                <span class="text-sm font-medium text-gray-700">ความคืบหน้า</span>
                <span id="progressText" class="text-sm font-medium text-purple-600">0%</span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-3">
                <div id="progressBar" class="gradient-bg h-3 rounded-full progress-bar" style="width: 0%"></div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Test Navigation -->
        <div class="bg-white rounded-xl shadow-lg p-6 mb-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-gray-800">แบบทดสอบ 4 ชุด</h2>
                <div class="flex space-x-2">
                    <button onclick="switchTest(1)" id="tab1" class="px-4 py-2 rounded-lg bg-purple-600 text-white font-medium">1. ทัศนคติ</button>
                    <button onclick="switchTest(2)" id="tab2" class="px-4 py-2 rounded-lg bg-gray-200 text-gray-700 font-medium">2. ทักษะ</button>
                    <button onclick="switchTest(3)" id="tab3" class="px-4 py-2 rounded-lg bg-gray-200 text-gray-700 font-medium">3. CC 7 ด้าน</button>
                    <button onclick="switchTest(4)" id="tab4" class="px-4 py-2 rounded-lg bg-gray-200 text-gray-700 font-medium">4. 3E3P</button>
                </div>
            </div>
            <div class="grid grid-cols-4 gap-4">
                <div class="text-center p-3 bg-purple-50 rounded-lg">
                    <i class="fas fa-smile text-2xl text-purple-600 mb-1"></i>
                    <p class="text-xs text-gray-600">ทัศนคติ</p>
                    <p class="text-sm font-semibold" id="test1Status">0/15</p>
                </div>
                <div class="text-center p-3 bg-gray-50 rounded-lg">
                    <i class="fas fa-tools text-2xl text-gray-400 mb-1"></i>
                    <p class="text-xs text-gray-600">ทักษะ</p>
                    <p class="text-sm font-semibold" id="test2Status">0/15</p>
                </div>
                <div class="text-center p-3 bg-gray-50 rounded-lg">
                    <i class="fas fa-star text-2xl text-gray-400 mb-1"></i>
                    <p class="text-xs text-gray-600">CC 7 ด้าน</p>
                    <p class="text-sm font-semibold" id="test3Status">0/20</p>
                </div>
                <div class="text-center p-3 bg-gray-50 rounded-lg">
                    <i class="fas fa-chart-line text-2xl text-gray-400 mb-1"></i>
                    <p class="text-xs text-gray-600">3E3P</p>
                    <p class="text-sm font-semibold" id="test4Status">0/15</p>
                </div>
            </div>
        </div>

        <!-- Test Content -->
        <div id="testContent" class="bg-white rounded-xl shadow-lg p-6">
            <!-- Questions will be loaded here -->
        </div>

        <!-- Navigation Buttons -->
        <div class="flex justify-between mt-6">
            <button onclick="previousQuestion()" id="prevBtn" class="bg-gray-300 text-gray-700 px-6 py-3 rounded-lg hover:bg-gray-400 transition disabled:opacity-50" disabled>
                <i class="fas fa-arrow-left mr-2"></i>ก่อนหน้า
            </button>
            <button onclick="nextQuestion()" id="nextBtn" class="bg-purple-600 text-white px-6 py-3 rounded-lg hover:bg-purple-700 transition">
                ถัดไป<i class="fas fa-arrow-right ml-2"></i>
            </button>
            <button onclick="submitTest()" id="submitBtn" class="hidden bg-green-600 text-white px-8 py-3 rounded-lg hover:bg-green-700 transition font-semibold">
                <i class="fas fa-check-circle mr-2"></i>ส่งคำตอบ
            </button>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script src="../js/test.js"></script>
</body>
</html>
