  <text x="773" y="1060" text-anchor="middle" font-size="10.5" fill="#475569">เกณฑ์เป็นหลักฐาน ไม่ใช่ความรู้สึก</text>
  <text x="773" y="1078" text-anchor="middle" font-size="10" fill="#7f1d1d">ผ่าน = นั่งต่อ / ไม่ผ่าน = กลับที่เดิม</text>
  <text x="773" y="1096" text-anchor="middle" font-size="10" fill="#7f1d1d">เปิดโควตาให้คนใหม่หมุนเข้า</text>
  <path d="M898 1058 H932" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#aDark)"/>

  <rect x="932" y="1000" width="228" height="118" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.4"/>
  <text x="1046" y="1022" text-anchor="middle" font-size="11.5" font-weight="700" fill="#854d0e">④ ช่องว่าง → สรรหา</text>
  <text x="1046" y="1042" text-anchor="middle" font-size="10.5" fill="#475569">GA ไม่พอ / BU ขาดคนเก่ง</text>
  <text x="1046" y="1060" text-anchor="middle" font-size="10.5" fill="#475569">→ ส่ง P1 แสวงหาภายนอก</text>
  <text x="1046" y="1078" text-anchor="middle" font-size="10" fill="#92400e">เลือกคนให้เหมาะกับงานมากที่สุด</text>
  <text x="1046" y="1096" text-anchor="middle" font-size="10" fill="#92400e">ปิดจุดอ่อนราย BU ทีละจุด</text>

  <!-- =================== PRINCIPLES =================== -->
  <rect x="60" y="1156" width="1120" height="220" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="620" y="1182" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">หลักการเดินงานของโครงสร้างนี้ (Design Principles)</text>

  <text x="84" y="1210" font-size="11.5" font-weight="700" fill="#3730a3">1 · ทีมเดียวสองหน้าที่:</text>
  <text x="84" y="1228" font-size="11" fill="#475569">ทีมบริหาร BU = ทีมบริหารกลยุทธ์ในหน่วยเดียวกัน เรียบ สั้น ประสานเร็ว · กลยุทธ์ที่ข้าม BU ทั้งหมด</text>
  <text x="84" y="1244" font-size="11" fill="#475569">เป็นงานของ Shared Strategy Core Team (ชั้น 4) — BU ไม่ต้องตั้งทีมกลยุทธ์ของตัวเองซ้ำ</text>

  <text x="84" y="1272" font-size="11.5" font-weight="700" fill="#15803d">2 · ผสมข้าม BU ตั้งแต่วันแรก:</text>
  <text x="84" y="1290" font-size="11" fill="#475569">Core Team 1 คน นั่งใน BMC ได้ทุกจำนวน — แรง deliberately จาก character + credit ไม่ใช่จากแผนกเดิม</text>
  <text x="84" y="1306" font-size="11" fill="#475569">ผล: มาตรฐานงานเท่ากันทั้งกลุ่ม + ละลายพฤติกรรมแยก BU + no single point of failure</text>

  <text x="84" y="1334" font-size="11.5" font-weight="700" fill="#b91c1c">3 · ตรวจสอบแยกจากถูกตรวจสอบ:</text>
  <text x="84" y="1352" font-size="11" fill="#475569">GA ไม่ได้บริหารงาน ไม่เข้าประชุมตัดสินใจ ตรวจตามรอบ + สุ่มตรวจ (Tech Audit) รายงานตรงต่อ OAC</text>
  <text x="84" y="1368" font-size="11" fill="#475569">OAC ใช้ Veto ได้สูงสุด 3 ครั้ง — เป็น Safety Gate ช่วงเปลี่ยนผ่าน ไม่ใช่การบริหารแทน</text>

  <!-- =================== OPEN ITEMS =================== -->
  <rect x="60" y="1396" width="1120" height="118" rx="10" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="620" y="1422" text-anchor="middle" font-size="13.5" font-weight="800" fill="#0369a1">เรื่องที่เวที OA ต้องปิดต่อ (Open Items)</text>
  <text x="84" y="1448" font-size="11" fill="#0c4a6e">① นิยามที่นั่ง F1–F4 ของ Shared Strategy Core Team (ชื่อฟังก์ชัน + ขอบเขต + ใคร Sit)   ② เกณฑ์ตัวเลขของแต่ละ "ด่านสามผ่าน"</text>
  <text x="84" y="1466" font-size="11" fill="#0c4a6e">(เกณฑ์ใดผ่าน/ตก ใครประเมิน ประเมินกี่รอบ/ปี)   ③ จำนวน + ตำแหน่งที่ GA ต้องการสรรหาเพิ่ม เรียงตามจุดอ่อน BU</text>
  <text x="84" y="1484" font-size="11" fill="#0c4a6e">④ PM/WI ที่แต่ละทีมถือ (Oversight/Advisory) — เวที OA เริ่มได้ทันที   ⑤ รอบประชุมและเส้นทางรายงาน BU → GA → OAC</text>
  <text x="620" y="1520" text-anchor="middle" font-size="10.5" fill="#94a3b8">Framework v1.0 · 8 ต.ค. 2569 · ร่างจากคำแนะนำ 5 ข้อของพี่ปกรณ์ — ไม่ผูกกับรายชื่อผู้ดำรงตำแหน่งใด ๆ</text>
