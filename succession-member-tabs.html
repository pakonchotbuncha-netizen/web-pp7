<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap');
body{font-family:'Sarabun',sans-serif}
.glass{background:rgba(255,255,255,.95);backdrop-filter:blur(8px)}
.card{border:1px solid #e5e7eb;transition:box-shadow .15s}
.card:hover{box-shadow:0 8px 24px rgba(0,0,0,.06)}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:9999px;font-size:11px;font-weight:700;border:1px solid}
.mchip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid #e2e8f0;border-radius:9999px;padding:6px 14px;font-size:13px;font-weight:600;background:#fff;cursor:pointer;transition:all .12s}
.mchip:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.mchip.active{border-width:2px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.mchip .dot{width:8px;height:8px;border-radius:99px;display:inline-block}
.ftab{display:inline-flex;align-items:center;gap:6px;border:1px solid #e2e8f0;border-bottom:none;border-radius:10px 10px 0 0;padding:8px 16px;font-size:13px;font-weight:700;background:#f8fafc;color:#64748b;cursor:pointer;transition:all .12s}
.ftab.active{background:#fff;color:#1e293b;border-color:#cbd5e1;position:relative;top:1px}
input[type="text"],input[type="number"],input[type="date"],textarea,select{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:8px 11px;font-size:13px;background:#fff;transition:border .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{outline:2px solid #6366f1;outline-offset:1px;border-color:#6366f1}
.lbl{display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:3px}
.btn-p{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;padding:9px 18px;border-radius:11px;font-weight:700;font-size:13px;transition:all .15s;box-shadow:0 4px 14px rgba(79,70,229,.25)}
.btn-p:hover{filter:brightness(1.07)}
.btn-o{border:1px solid #cbd5e1;background:#fff;color:#475569;padding:7px 13px;border-radius:10px;font-weight:600;font-size:12px;transition:all .15s;cursor:pointer}
.btn-o:hover{background:#f1f5f9;border-color:#94a3b8}
.btn-add{border:1.5px dashed #a5b4fc;background:#f5f6ff;color:#4f46e5;padding:7px 13px;border-radius:10px;font-weight:700;font-size:12px;cursor:pointer;transition:all .15s}
.btn-add:hover{background:#eef2ff}
.btn-del{color:#dc2626;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:3px 9px;font-size:11px;font-weight:700;cursor:pointer}
.btn-del:hover{background:#fee2e2}
.item-box{border:1px solid #e2e8f0;border-radius:14px;background:#fff}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:#1e293b;color:#fff;padding:11px 22px;border-radius:12px;font-size:14px;opacity:0;transition:all .3s;pointer-events:none;z-index:90;max-width:92vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.align-tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:9999px;font-size:10.5px;font-weight:700;margin:1.5px;cursor:pointer;border:1px solid}
.align-tag.on{background:#dcfce7;color:#15803d;border-color:#86efac}
.align-tag.off{background:#f1f5f9;color:#94a3b8;border-color:#e2e8f0}
.okr-ref{font-size:11px;line-height:1.5}
.prog{height:8px;border-radius:99px;background:#e2e8f0;overflow:hidden}
.prog>div{height:100%;border-radius:99px;transition:width .3s}
@media print{.no-print{display:none!important}}
</style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

<header class="glass border-b border-slate-200 shadow-sm sticky top-0 z-40 no-print">
<div class="max-w-7xl mx-auto px-4 sm:px-6 py-4">

<div>
<h1 class="text-xl sm:text-2xl font-extrabold text-slate-900">👤 สมาชิกรายคน <span class="text-indigo-600">— บทบาท · กลยุทธ์ · ความเชื่อมโยง · OKR/KPI</span></h1>
<p class="text-xs text-slate-500 mt-1">แต่ละคนกรอก/แก้ไขข้อมูลของตนเอง — งานที่รับผิดชอบ · กลยุทธ์ (BSC) · บทบาทเชื่อมโยงข้ามระดับ · OKR/KPI เทียบเป้าหมายองค์กร • PKG Succession Plan 2026–2030</p>
</div>
<div class="flex flex-wrap gap-2">

</div>

<main class="max-w-7xl mx-auto px-4 sm:px-6 py-5 pb-24" id="main"></main>

<script>
/* ================= โครงสร้างองค์กร ================= */
const ORG = {
  OAC:{icon:'🏛',label:'OAC',level:1,levelTxt:'ลำดับชั้น 1 (สูงสุด)',color:'rose',hex:'#e11d48',
    scope:'ดูทุกกลยุทธ์ (ทุกด้าน BSC)',role:'กำกับดูแล (Oversight) · ให้คำปรึกษา (Advise) · ทบทวนผล (Review) · ยับยั้ง (Veto — Safety Gate 3 ครั้ง)',
    duties:[['👁 Oversight','กำกับดูแลแนวทางการทำงานของกลยุทธ์ทุกด้าน — ไม่ทำงาน operation แต่ดูว่ากลยุทธ์เดินถูกทาง'],
      ['💬 Advise','ให้คำปรึกษาแก่ GAT และ ADM — ถอดประสบการณ์บริหารส่งต่อทีมใหม่'],
      ['🔍 Review','ทบทวนผลงาน รายงาน และทิศทาง — ตรวจ Monthly Audit/Oversight Report จาก GAT'],
      ['🛑 Veto','ยับยั้งเรื่องสำคัญที่มีความเสี่ยงรุนแรง — Safety Gate สูงสุด 3 ครั้ง (เข้มสุด 2026–2027 แล้วลดลงเรื่อย ๆ)'],
      ['🤝 Co-Ownership กับ GAT','ดูแลให้การตรวจสอบเข้มข้น — ร่วมเป็นเจ้าของการกำกับช่วงเปลี่ยนผ่าน'],
      ['🔗 ความเชื่อมโยง','เชื่อมกับทุกชั้น: ให้คำปรึกษา/ทบทวน/Veto ต่อ GAT และ ADM · รับรายงาน Audit รายเดือนจาก GAT']],
    vetoNote:'⚖️ หลัก Veto (Safety Gate): ใช้ได้สูงสุด 3 ครั้ง — เข้มข้นสุดช่วง 2026–2027 แล้วลดลงเรื่อย ๆ · ครบ 3 ครั้งแล้วทีมใหม่ทำงานเหมาะสม = ทีมใหม่พร้อม · Veto = ป้องกันความเสียหายช่วงเปลี่ยนผ่าน ไม่ใช่ทำงานแทนทีมใหม่',
    members:['คุณประวิทย์','พี่ต๋อง','พี่ก้อย']},
  GAT:{icon:'🛡',label:'GAT',level:2,levelTxt:'ลำดับชั้น 2 (กลาง)',color:'amber',hex:'#f59e0b',
    scope:'เฉพาะด้าน BSC ที่รับผิดชอบ',role:'พี่เลี้ยง ADM · ตรวจสอบการดำเนินงาน/ความเสี่ยง/Compliance · Tech Audit · Monthly Audit/Oversight Report ส่ง OAC',
    duties:[['🤝 พี่เลี้ยง ADM','สอนงาน ถ่ายทอดประสบการณ์ ดูแลการเติบโตของทีมบริหารใหม่'],
      ['🔍 ตรวจสอบ','การดำเนินงาน / ความเสี่ยง / Compliance / ผลลัพธ์ ของกลยุทธ์ด้าน BSC ที่รับผิดชอบ'],
      ['💻 Tech Audit','ตรวจสอบเชิงเทคโนโลยีตามรอบ'],
      ['📄 Monthly Report','รายงาน Audit/Oversight ประจำเดือนส่ง OAC'],
      ['🧭 ที่มา','GAT = ADM เก่าเปลี่ยนบทบาทมาเป็น "พี่เลี้ยง" — ยังรับผิดชอบงานบทบาทเดิม + เพิ่มบทบาทที่ปรึกษาให้ ADM ใหม่'],
      ['🔗 ความเชื่อมโยง','รายงาน Audit/Oversight ขึ้น OAC · พี่เลี้ยง/Cover/Co-Ownership ลง ADM']],
    members:['พี่กอล์ฟ','พี่อี๊ด','พี่เก๋','พี่อ้วน','พี่อ๊อด','พี่หวาน','พี่ญา','พี่ติ๋ม','พี่หนึ่ง','พี่สิงห์','พี่ปุ๊','คุณบอล']},
  ADM:{icon:'🚀',label:'ADM',level:3,levelTxt:'ลำดับชั้น 3 (เบื้องต้น)',color:'sky',hex:'#0284c7',
    scope:'เฉพาะด้าน BSC ที่รับผิดชอบ',role:'ทีมบริหารชุดใหม่ · รับพี่เลี้ยงจาก GAT · รับการกำกับจาก OAC · ฝึกบริหารแนวทางกลยุทธ์ (ไม่ใช่ operation)',
    duties:[['🎯 บริหารกลยุทธ์','บริหารแนวทางการทำงานของกลยุทธ์ด้าน BSC ที่รับผิดชอบ (ไม่ทำงาน operation)'],
      ['🌱 พัฒนา 4 ด้าน','Operation+อำนาจตัดสินใจ · Tech/Digital/AI/Automation · รักษา Culture/Value PKG · สร้างธุรกิจใหม่'],
      ['🤝 รับการพี่เลี้ยง','เรียนรู้จาก GAT (Cover/Co-Ownership) และรับการกำกับจาก OAC'],
      ['👥 ปั้นรุ่นถัดไป','ฝึกฝนทีมต่อเนื่อง — succession ไม่สิ้นสุดที่ตนเอง'],
      ['📤 เงื่อนไขถ่ายทอด','ต้องผ่านก่อน 5 ข้อ: Operation Strategy Execution · ลดหนี้ตามเป้า · งานเงื่อนไข (AMS5) · รับผิดชอบจริง · Co-Ownership'],
      ['🔗 ความเชื่อมโยง','รับพี่เลี้ยงจาก GAT · รับการกำกับ/Advise/Veto จาก OAC · ช่วยกันเองในทีม ADM']],
    members:['น้องแซน','โอม','จ้อน','แนน']}
};
const GROUP_OF={}; Object.entries(ORG).forEach(([g,c])=>c.members.forEach(m=>GROUP_OF[m]=g));
const ALL_MEMBERS=[...ORG.OAC.members,...ORG.GAT.members,...ORG.ADM.members];
const BSC=[['Financial','💰 การเงิน'],['Customer','🤝 ลูกค้า'],['Internal','⚙️ กระบวนการภายใน'],['Learning','🌱 การเรียนรู้และเติบโต']];

/* เป้าหมายองค์กร — OKR หลัก (ใช้เทียบความสอดคล้อง) */
const ORG_OKR=[
 {id:'O1',obj:'สร้างระบบและวัฒนธรรมองค์กรที่ทำให้สมาชิกเติบโต มั่นคง และผูกพันระยะยาว',krs:[
  {id:'O1-KR1',t:'ทุกบทบาทสำคัญมี "ผู้สืบทอดพร้อมปฏิบัติ" ≥1 คน (6 เดือน ≥50% critical roles)'},
  {id:'O1-KR2',t:'สมาชิก ≥85% มี CC Profile ครบ 5 ประการ ระดับ ≥3.5'},
  {id:'O1-KR3',t:'Culture Index ≥4.0 จาก 5.0 ภายใน 1 ปี'}]},
 {id:'O2',obj:'พัฒนาศักยภาพสมาชิกให้พร้อมต่อการทำงานยุค AI และ Digital Workforce',krs:[
  {id:'O2-KR1',t:'สมาชิก ≥85% ผ่านหลักสูตร AI/3A และนำไปใช้ในงานจริง'},
  {id:'O2-KR2',t:'ลด Manhour งานซ้ำซ้อน ≥20% โดยใช้ AI/3A'},
  {id:'O2-KR3',t:'สมาชิกใหม่ทุกบทบาทผ่านระบบ Audition + P2 ภายใน 90 วัน'}]},
 {id:'O3',obj:'สร้างระบบการเรียนรู้และข้อมูลอัจฉริยะ เพื่อพัฒนาสมาชิกและองค์กรอย่างต่อเนื่อง',krs:[
  {id:'O3-KR1',t:'CC Profile สมาชิกครบ 100% อัปเดตอัตโนมัติหลัง P4 ทุกครั้งภายใน 7 วัน'},
  {id:'O3-KR2',t:'P1→P7 ไหลข้อมูลอัตโนมัติ ไม่ต้องกรอกซ้ำ ≥80%'},
  {id:'O3-KR3',t:'100% การตัดสินใจโยกย้าย/เลื่อน/พัฒนา ใช้ข้อมูลจาก PP7 เป็นฐาน'}]}
];
const ALL_ORG_KRS=ORG_OKR.flatMap(o=>o.krs.map(k=>({...k,obj:o.obj,oid:o.id})));
const OTHER_ALIGN=['เงื่อนไขถ่ายทอด: Operation Strategy Execution','เงื่อนไขถ่ายทอด: ลดหนี้ตามเป้าหมาย','เงื่อนไขถ่ายทอด: งานเงื่อนไข (เช่น AMS5)','เงื่อนไขถ่ายทอด: รับผิดชอบจริง','เงื่อนไขถ่ายทอด: Co-Ownership','พัฒนาทีมใหม่: Operation + อำนาจตัดสินใจ','พัฒนาทีมใหม่: Tech/Digital/AI/Automation','พัฒนาทีมใหม่: รักษา Culture/Value PKG','พัฒนาทีมใหม่: สร้างธุรกิจใหม่'];

const LS='pkg_succession_members_v1';
/* ☁️ เชื่อมชีตกลาง — Google Sheet "แผนสืบทอดบทบาท PKG" tab "SP-สมาชิกรายคน" */
const GAS_URL='https://script.google.com/macros/s/AKfycbwGWjI5cZkt80HOC6JNrn9RtjwrDRuPa4DDjapM8-LosR4o00310pwcIoS_j8bKP1OW/exec';
let DB={}; try{DB=JSON.parse(localStorage.getItem(LS)||'{}')}catch{DB={}}
let curMember=null, curTab='resp', curGroup='ALL';
let cloudOk=null; // null=ยังไม่รู้, true/false

function isEmptyRec(r){return !r.resp.length&&!r.strat.length&&!r.links.length&&!r.okrs.length&&!r.meta.company&&!r.meta.note&&!r.alignNote}
async function pushMember(m){
 if(!GAS_URL)return;
 const r=rec(m);
 try{
  const res=await fetch(GAS_URL+'?action=saveMember',{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({member:m,group:GROUP_OF[m],level:ORG[GROUP_OF[m]].levelTxt,data:r})});
  cloudOk=res.ok||res.type==='opaque';
 }catch(e){cloudOk=false}
 updateCloudBadge();
}
async function pushAll(){
 const list=ALL_MEMBERS.filter(m=>DB[m]&&!isEmptyRec(DB[m]));
 if(!list.length){toast('ยังไม่มีข้อมูลให้ push');return}
 toast('⏳ กำลัง push '+list.length+' คน…');
 for(const m of list){await pushMember(m)}
 toast('☁️ push '+list.length+' คนเข้าชีตกลางแล้ว');
}
async function pullCloud(){
 if(!GAS_URL){toast('ยังไม่ได้ตั้ง GAS_URL');return}
 toast('⏳ กำลังโหลดจากชีตกลาง…');
 try{
  const res=await fetch(GAS_URL+'?action=listMembers');
  const j=await res.json();
  cloudOk=!!j.success;
  let n=0;
  (j.members||[]).forEach(cm=>{
   if(!ALL_MEMBERS.includes(cm.member))return;
   const local=DB[cm.member];
   // cloud ชนะเมื่อ local ว่าง/ไม่มี (ไม่ทับงานที่คนนั้นกำลังกรอกบนเครื่องตัวเอง)
   if(!local||isEmptyRec(local)){DB[cm.member]={...blank(),...(cm.data||{})};n++}
  });
  save();renderHead();renderMain();
  toast('☁️ โหลดจากชีตกลางแล้ว ('+(j.count||0)+' ชุดในชีต · ใส่เครื่องนี้ '+n+' คน)');
 }catch(e){cloudOk=false;toast('โหลดไม่สำเร็จ: '+e.message)}
 updateCloudBadge();
}
function updateCloudBadge(){
 const el=document.getElementById('cloudBadge');
 if(!el)return;
 el.textContent=cloudOk===true?'☁️ เชื่อมชีตกลางแล้ว':cloudOk===false?'⚠️ ชีตกลางเชื่อมต่อไม่ได้':'☁️ ชีตกลาง: SP-สมาชิกรายคน';
 el.style.color=cloudOk===false?'#dc2626':'#0284c7';
}
function saveDeb(){clearTimeout(window._sv);window._sv=setTimeout(()=>{save();toast('💾 บันทึกอัตโนมัติแล้ว');if(curMember)pushMember(curMember)},1200)}
function rec(m){if(!DB[m])DB[m]=blank();return DB[m]}
function save(){localStorage.setItem(LS,JSON.stringify(DB))}
function blank(){return {meta:{company:'',note:''},resp:[],strat:[],links:[],okrs:[],alignNote:''}}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function saveDebOld_removed(){}

/* ================= Header: filter + chips ================= */
function renderHead(){
 const gf=document.getElementById('groupFilter');
 gf.innerHTML=`<button class="mchip ${curGroup==='ALL'?'active':''}" style="${curGroup==='ALL'?'border-color:#6366f1;color:#4f46e5':''}" onclick="setGroup('ALL')">ทั้งหมด (${ALL_MEMBERS.length})</button>`
  +Object.entries(ORG).map(([g,c])=>`<button class="mchip ${curGroup===g?'active':''}" style="${curGroup===g?`border-color:${c.hex};color:${c.hex}`:''}" onclick="setGroup('${g}')">${c.icon} ${g} — ${c.levelTxt} (${c.members.length})</button>`).join('');
 const mc=document.getElementById('memberChips');
 const list=curGroup==='ALL'?ALL_MEMBERS:ORG[curGroup].members;
 mc.innerHTML=list.map(m=>{const g=GROUP_OF[m],c=ORG[g];const r=rec(m);const filled=r.resp.length+r.strat.length+r.links.length+r.okrs.length;
  return `<button class="mchip ${curMember===m?'active':''}" style="${curMember===m?`border-color:${c.hex}`:''}" onclick="setMember('${m}')"><span class="dot" style="background:${c.hex}"></span>${m}${filled?` <span style="font-size:10px;color:#16a34a">●</span>`:''}</button>`}).join('');
}

 <div class="flex items-center justify-between mb-3">
  <div><div class="font-extrabold text-slate-800">📏 OKR / KPI ของ ${curMember} (${r.okrs.length} Objective)</div>
  <div class="text-xs text-slate-500">Objective → Key Result → KPI (ตัววัด + เป้าหมาย + ผลจริง) • <b>OKR = move the business forward / KPI = keep the business running</b></div></div>
  <button class="btn-add" onclick="addObj()">＋ เพิ่ม Objective</button>
 </div>
 <div class="space-y-4">${r.okrs.map((o,oi)=>objBox(o,oi)).join('')||'<div class="text-center text-slate-400 text-sm py-6">ยังไม่มี — กด "＋ เพิ่ม Objective"</div>'}</div>`;
}
function objBox(o,oi){
 return `<div class="item-box p-4 border-l-4 border-l-indigo-400">
 <div class="flex justify-between items-start gap-2 mb-2">
  <span class="badge bg-indigo-50 text-indigo-700 border-indigo-200">Objective ${oi+1}</span>
  <button class="btn-del" onclick="delItem('okrs',${oi})">ลบ Objective</button>
 </div>
 <input type="text" class="font-semibold" value="${esc(o.objective)}" placeholder="O — เป้าหมายเชิงกลยุทธ์ของตนเอง เช่น ถ่ายทอดการกำกับด้านการเงินให้ทีมใหม่ได้ภายใน 2027" onchange="updOKR(${oi},'objective',this.value)">
 <div class="mt-3 space-y-3">
  ${(o.krs||[]).map((k,ki)=>krBox(o,oi,k,ki)).join('')}
  <button class="btn-add" onclick="addKR(${oi})">＋ เพิ่ม Key Result</button>
 </div></div>`;
}
function krBox(o,oi,k,ki){
 const kpis=k.kpis||[];
 return `<div class="border border-slate-200 rounded-xl p-3 bg-slate-50/60">
 <div class="flex justify-between items-start gap-2 mb-2">
  <span class="badge bg-white text-slate-600 border-slate-300">KR${oi+1}.${ki+1}</span>
  <button class="btn-del" onclick="delKR(${oi},${ki})">ลบ KR</button>
 </div>
 <input type="text" value="${esc(k.kr)}" placeholder="KR — ผลลัพธ์ที่วัดได้ เช่น พี่เลี้ยง ADM ผ่านเกณฑ์พร้อมส่งต่อ 3 ใน 5 ข้อ" onchange="updKR(${oi},${ki},'kr',this.value)">
 <div class="mt-2 mb-2"><span class="lbl">🔗 สอดคล้องกับเป้าหมายองค์กร (คลิกเลือก — ใช้เช็คใน tab "สอดคล้องเป้าหมาย")</span>
  <div class="flex flex-wrap">${ALL_ORG_KRS.map(ok=>{const on=(k.align||[]).includes(ok.id);return `<button type="button" class="align-tag ${on?'on':'off'}" title="${esc(ok.obj)}" onclick="toggleAlign(${oi},${ki},'${ok.id}')">${ok.id}</button>`}).join('')}
  ${OTHER_ALIGN.map((t,ti)=>{const key='X'+ti;const on=(k.align||[]).includes(key);return `<button type="button" class="align-tag ${on?'on':'off'}" title="${esc(t)}" onclick="toggleAlign(${oi},${ki},'${key}')">${t.split(':')[0]==='เงื่อนไขถ่ายทอด'?'📤 '+t.split(': ')[1]:'🌱 '+t.split(': ')[1]}</button>`}).join('')}
  </div></div>
 <div class="space-y-2">
  ${kpis.map((p,pi)=>kpiRow(oi,ki,p,pi)).join('')}
  <button class="btn-add" onclick="addKPI(${oi},${ki})">＋ เพิ่ม KPI</button>
 </div></div>`;
}
function kpiRow(oi,ki,p,pi){
 const tgt=parseFloat(p.target),act=parseFloat(p.actual);
 let pct=null; if(!isNaN(tgt)&&!isNaN(act)&&tgt!==0)pct=Math.round(act/tgt*100);
 const col=pct==null?'#94a3b8':pct>=100?'#16a34a':pct>=70?'#f59e0b':'#ef4444';
 return `<div class="grid grid-cols-12 gap-2 items-end bg-white border border-slate-200 rounded-lg p-2">
  <div class="col-span-12 md:col-span-5"><span class="lbl">KPI ตัววัด ${pi+1}</span>
   <input type="text" value="${esc(p.name)}" placeholder="เช่น จำนวนรอบ Monthly Audit Report ที่ส่งตรงเวลา" onchange="updKPI(${oi},${ki},${pi},'name',this.value)"></div>
  <div class="col-span-3 md:col-span-2"><span class="lbl">เป้าหมาย</span>
   <input type="text" value="${esc(p.target)}" placeholder="12" onchange="updKPI(${oi},${ki},${pi},'target',this.value)"></div>
  <div class="col-span-3 md:col-span-2"><span class="lbl">ผลจริง</span>
   <input type="text" value="${esc(p.actual)}" placeholder="0" onchange="updKPI(${oi},${ki},${pi},'actual',this.value)"></div>
  <div class="col-span-4 md:col-span-2">
   ${pct!=null?`<div class="text-[10px] font-bold mb-1" style="color:${col}">${pct}%</div><div class="prog"><div style="width:${Math.min(pct,100)}%;background:${col}"></div></div>`:'<div class="text-[10px] text-slate-400">ใส่ตัวเลขเป้า/ผล</div>'}
  </div>
  <div class="col-span-2 md:col-span-1 text-right"><button class="btn-del" onclick="delKPI(${oi},${ki},${pi})">ลบ</button></div>
 </div>`;
}
function addObj(){rec(curMember).okrs.push({objective:'',krs:[]});save();renderTab()}
function addKR(oi){rec(curMember).okrs[oi].krs.push({kr:'',align:[],kpis:[]});save();renderTab()}
function addKPI(oi,ki){rec(curMember).okrs[oi].krs[ki].kpis=rec(curMember).okrs[oi].krs[ki].kpis||[];rec(curMember).okrs[oi].krs[ki].kpis.push({name:'',target:'',actual:''});save();renderTab()}
function delKR(oi,ki){rec(curMember).okrs[oi].krs.splice(ki,1);save();renderTab()}
function delKPI(oi,ki,pi){rec(curMember).okrs[oi].krs[ki].kpis.splice(pi,1);save();renderTab()}
function updOKR(oi,f,v){rec(curMember).okrs[oi][f]=v;saveDeb()}
function updKR(oi,ki,f,v){rec(curMember).okrs[oi].krs[ki][f]=v;saveDeb()}
function updKPI(oi,ki,pi,f,v){rec(curMember).okrs[oi].krs[ki].kpis[pi][f]=v;save();renderTab()}
function toggleAlign(oi,ki,id){const k=rec(curMember).okrs[oi].krs[ki];k.align=k.align||[];const x=k.align.indexOf(id);x>=0?k.align.splice(x,1):k.align.push(id);save();renderTab()}

/* ========== TAB 5: สอดคล้องเป้าหมาย ========== */
function tabAlign(){
 const r=rec(curMember);const g=GROUP_OF[curMember];const c=ORG[g];
 // รวม alignment จากทุก KR
 const used=new Set();let totalKR=0,alignedKR=0;
 r.okrs.forEach(o=>(o.krs||[]).forEach(k=>{totalKR++;if((k.align||[]).length){alignedKR++;k.align.forEach(a=>used.add(a))}}));
 const orgCovered=ALL_ORG_KRS.filter(k=>used.has(k.id)).length;
 const otherCovered=OTHER_ALIGN.filter((_,i)=>used.has('X'+i)).length;
 const pctKR=totalKR?Math.round(alignedKR/totalKR*100):0;
 const pctOrg=Math.round(orgCovered/ALL_ORG_KRS.length*100);
 return `
 <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-5">
  <div class="item-box p-4 text-center"><div class="text-2xl font-extrabold" style="color:${pctKR>=70?'#16a34a':pctKR>=40?'#f59e0b':'#ef4444'}">${pctKR}%</div>
   <div class="text-xs text-slate-500">KR ของตนเองที่ผูกกับเป้าหมายองค์กร (${alignedKR}/${totalKR})</div>
   <div class="prog mt-2"><div style="width:${pctKR}%;background:${pctKR>=70?'#16a34a':pctKR>=40?'#f59e0b':'#ef4444'}"></div></div></div>
  <div class="item-box p-4 text-center"><div class="text-2xl font-extrabold text-indigo-600">${orgCovered}/${ALL_ORG_KRS.length}</div>
   <div class="text-xs text-slate-500">OKR องค์กร (9 KR) ที่งานของตนเองไปหนุน (${pctOrg}%)</div>
   <div class="prog mt-2"><div style="width:${pctOrg}%;background:#4f46e5"></div></div></div>
  <div class="item-box p-4 text-center"><div class="text-2xl font-extrabold text-amber-600">${otherCovered}/${OTHER_ALIGN.length}</div>
   <div class="text-xs text-slate-500">เงื่อนไขถ่ายทอด/พัฒนาทีมใหม่ ที่งานตนเองเกี่ยวข้อง</div>
   <div class="prog mt-2"><div style="width:${Math.round(otherCovered/OTHER_ALIGN.length*100)}%;background:#f59e0b"></div></div></div>
 </div>

 <div class="font-extrabold text-slate-800 mb-2">🎯 เป้าหมายองค์กร (OKR หลัก) — สถานะการสอดคล้องของ ${curMember}</div>
 <div class="space-y-3 mb-5">
 ${ORG_OKR.map(o=>`<div class="item-box p-4">
   <div class="font-bold text-sm text-slate-800 mb-2">${o.id}: ${esc(o.obj)}</div>
   ${o.krs.map(k=>{const on=used.has(k.id);const linkedBy=[];r.okrs.forEach((oo,oi)=>(oo.krs||[]).forEach((kk,ki)=>{if((kk.align||[]).includes(k.id))linkedBy.push(`O${oi+1}-KR${oi+1}.${ki+1}${kk.kr?': '+kk.kr.slice(0,60):''}`)}));
    return `<div class="okr-ref flex items-start gap-2 py-1.5 border-t border-slate-100">
     <span class="align-tag ${on?'on':'off'}" style="cursor:default">${on?'✅':'⬜'} ${k.id}</span>
     <div class="flex-1"><span class="${on?'text-slate-700':'text-slate-400'}">${esc(k.t)}</span>
     ${linkedBy.length?`<div class="text-[10px] text-emerald-700 mt-0.5">← หนุนโดย: ${linkedBy.map(esc).join(' · ')}</div>`:'<div class="text-[10px] text-slate-300 mt-0.5">— ยังไม่มี KR ของตนเองที่ผูก —</div>'}</div></div>`}).join('')}
  </div>`).join('')}
 </div>

 <div class="font-extrabold text-slate-800 mb-2">📤 เงื่อนไขถ่ายทอด 5 ข้อ & 🌱 ทีมใหม่ต้องพัฒนา 4 ด้าน</div>
 <div class="item-box p-4 mb-5">
  <div class="flex flex-wrap">${OTHER_ALIGN.map((t,i)=>{const on=used.has('X'+i);return `<span class="align-tag ${on?'on':'off'}" style="cursor:default">${on?'✅':'⬜'} ${esc(t)}</span>`}).join('')}</div>
 </div>

 <div class="font-extrabold text-slate-800 mb-2">📝 สรุปของตนเอง: งาน/OKR ของฉันสอดคล้องกับเป้าหมายองค์กรอย่างไร</div>
 <textarea rows="4" placeholder="เขียนสรุปด้วยตนเอง เช่น งานกำกับกลยุทธ์การเงินของฉันหนุน O1-KR1 และเงื่อนไขลดหนี้… สิ่งที่ยังขาดคือ…" onchange="updAlignNote(this.value)">${esc(r.alignNote)}</textarea>
 <div class="text-[11px] text-slate-400 mt-2">วิธีใช้: ไปที่ tab "📏 OKR / KPI" → ในแต่ละ KR คลิกเลือกว่าสอดคล้องกับเป้าหมายองค์กรข้อไหน → กลับมา tab นี้เพื่อดูภาพรวมความสอดคล้อง</div>`;
}
function updAlignNote(v){rec(curMember).alignNote=v;saveDeb()}

/* ========== generic updaters ========== */
function updMeta(f,v){rec(curMember).meta[f]=v;saveDeb()}
function updItem(sec,i,f,v){rec(curMember)[sec][i][f]=v;saveDeb()}
function delItem(sec,i){if(!confirm('ลบรายการนี้?'))return;rec(curMember)[sec].splice(i,1);save();renderTab();renderHead()}

/* ========== Export / Import ========== */
function exportJSON(){
 const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),members:DB},null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pkg_succession_members.json';a.click();toast('Export JSON แล้ว')}
function importJSON(ev){
 const f=ev.target.files[0];if(!f)return;const rd=new FileReader();
 rd.onload=()=>{try{const d=JSON.parse(rd.result);const m=d.members||d;
  Object.entries(m).forEach(([k,v])=>{if(ALL_MEMBERS.includes(k))DB[k]={...blank(),...v}});
  save();renderHead();renderMain();toast('Import สำเร็จ')}catch(e){toast('ไฟล์ไม่ถูกต้อง')}};
 rd.readAsText(f);ev.target.value=''}
function exportCSV(){
 const rows=[];const head=['member','group','level','section','item_no','field1','field2','field3','field4','field5','field6','field7'];
 ALL_MEMBERS.forEach(m=>{const r=DB[m];if(!r)return;const g=GROUP_OF[m],c=ORG[g];
  (r.resp||[]).forEach((x,i)=>rows.push([m,g,c.levelTxt,'งานรับผิดชอบ',i+1,x.title,RESP_TYPES.find(t=>t[0]===x.type)?.[1]||x.type,x.mainRole||'',x.detail,x.period,x.status,'']));
  (r.strat||[]).forEach((x,i)=>rows.push([m,g,c.levelTxt,'กลยุทธ์',i+1,x.bsc,x.name,x.how,x.goal,x.involve,'','']));
  (r.links||[]).forEach((x,i)=>rows.push([m,g,c.levelTxt,'เชื่อมโยง',i+1,x.dir,x.toGroup,x.toName,(x.mechs||[]).map(v=>MECHS.find(t=>t[0]===v)?.[1]||v).join('; '),x.detail,'','']));
  (r.okrs||[]).forEach((o,oi)=>(o.krs||[]).forEach((k,ki)=>{
   if(!(k.kpis||[]).length)rows.push([m,g,c.levelTxt,'OKR',`${oi+1}.${ki+1}`,o.objective,k.kr,(k.align||[]).join('; '),'','','','']);
   (k.kpis||[]).forEach((p,pi)=>rows.push([m,g,c.levelTxt,'OKR-KPI',`${oi+1}.${ki+1}.${pi+1}`,o.objective,k.kr,(k.align||[]).join('; '),p.name,p.target,p.actual,'']));
  }));
 });
 const esc2=v=>`"${String(v??'').replace(/"/g,'""')}"`;
 let csv='\uFEFF'+head.join(',')+'\n'+rows.map(r=>r.map(esc2).join(',')).join('\n');
 const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pkg_succession_members.csv';a.click();toast('Export CSV แล้ว')}

document.addEventListener('DOMContentLoaded',()=>{renderHead();renderMain();updateCloudBadge();pullCloud()});
</script>
</body>
</html>
