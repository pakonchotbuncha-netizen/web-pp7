<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1046" viewBox="0 0 1360 1046" font-family="Sarabun"><rect width="1360" height="1046" fill="#f4f7fb"/><defs><linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a2a04"/><stop offset="1" stop-color="#a35a06"/></linearGradient>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#e8930c" flood-opacity="0.15"/></filter></defs><rect x="44" y="44" width="1272" height="126" rx="16" fill="url(#hdr)"/><text x="80" y="98" font-family="Sarabun" font-weight="700" font-size="29" fill="#fff">จุดเสริม AI เพิ่มเติม — นอกเหนือจาก 6 จุดในผังเดิม</text><text x="80" y="132" font-family="Sarabun" font-weight="700" font-size="19" fill="#ffe1b3">ตอบโจทย์ "เสริมจุดที่นำ AI เข้ามาเพิ่มผลผลิต" — ครอบคลุมทั้งกระบวนการ 01-12 (อ้างบทเรียนจาก Bug Log ระบบเดิม)</text><text x="80" y="158" font-family="Sarabun" font-size="14.5" fill="#ffd9a0">เอกสาร LDC-PAO-PM-001-AI-ENHANCEMENT · จัดทำโดย KiloClaw · 6 ต.ค. 2569</text><circle cx="70" cy="240" r="24" fill="#e8930c"/><text x="70" y="247" text-anchor="middle" font-family="Sarabun" font-weight="700" font-size="19" fill="#fff">A</text><rect x="106" y="214" width="1210" height="122" rx="12" fill="#fff" stroke="#f0c987" stroke-width="2" filter="url(#soft)"/><rect x="1203" y="227" width="93" height="25" rx="12" fill="#fff7ea" stroke="#e8930c" stroke-width="1.3"/><text x="1249.5" y="244" text-anchor="middle" font-family="Sarabun" font-weight="700" font-size="12" fill="#c66a00">เสริมใหม่</text><text x="128" y="252" font-family="Sarabun" font-weight="700" font-size="17.5" fill="#132743">ขั้น 01 — AI ตรวจฟอร์มขออัตรากำลังทันทีที่กรอก</text><text x="128" y="278" font-family="Sarabun" font-size="14.5" fill="#3c4a5c">ตรวจฟอร์มขออัตราว่าครบ/ถูก format ทันที (คุณสมบัติ · จำนวน · เงื่อนไข) แล้วเด้งให้หน่วยงานแก้ภายใน 5-10 นาที</text><rect x="128" y="301" width="1166" height="31" rx="7" fill="#eef4ff" stroke="#dbe8fa"/><text x="142" y="323" font-family="Sarabun" font-weight="700" font-size="13.8" fill="#0b62d6">ทำไมจึงต้องเสริม:</text><text x="302" y="323" font-family="Sarabun" font-size="13.8" fill="#1c3a5e">ที่มาของคุณสมบัติ = JOB_POSTING — ถ้าไม่ครบ ทั้งสายขั้น 03-07 ต้องตามถามซ้ำ (ลดงานตามแก้ต้นทาง)</text><circle cx="70" cy="376" r="24" fill="#e8930c"/><text x="70" y="383" text-anchor="middle" font-family="Sarabun" font-weight="700" font-size="19" fill="#fff">B</text><rect x="106" y="350" width="1210" height="122" rx="12" fill="#fff" stroke="#f0c987" stroke-width="2" filter="url(#soft)"/><rect x="1203" y="363" width="93" height="25" rx="12" fill="#fff7ea" stroke="#e8930c" stroke-width="1.3"/><text x="1249.5" y="380" text-anchor="middle" font-family="Sarabun" font-weight="700" font-size="12" fill="#c66a00">เสริมใหม่</text><text x="128" y="388" font-family="Sarabun" font-weight="700" font-size="17.5" fill="#132743">ขั้น 02 — AI ช่วยวางแผนการสรรหา (P1)</text><text x="128" y="414" font-family="Sarabun" font-size="14.5" fill="#3c4a5c">วิเคราะห์ข้อมูลการจ้างงานในอดีต + อัตราลาออก + การเคลื่อนที่ของทีม → ช่วย PAO ตั้งจำนวนเสนอ + ช่องทางที่เหมาะกับตำแหน่ง</text><rect x="128" y="437" width="1166" height="31" rx="7" fill="#eef4ff" stroke="#dbe8fa"/><text x="142" y="459" font-family="Sarabun" font-weight="700" font-size="13.8" fill="#0b62d6">ทำไมจึงต้องเสริม:</text><text x="302" y="459" font-family="Sarabun" font-size="13.8" fill="#1c3a5e">เปลี่ยนจากอาศัยประสบการณ์ล้วน → ใช้ข้อมูลจริงประกอบการตัดสิน (Data-Driven)</text><circle cx="70" cy="512" r="24" fill="#e8930c"/><text x="70" y="519" text-anchor="middle" font-family="Sarabun" font-weight="700" font-size="19" fill="#fff">C</text><rect x="106" y="486" width="1210" height="122" rx="12" fill="#fff" stroke="#f0c987" stroke-width="2" filter="url(#soft)"/><rect x="1203" y="499" width="93" height="25" rx="12" fill="#fff7ea" stroke="#e8930c" stroke-width="1.3"/><text x="1249.5" y="516" text-anchor="middle" font-family="Sarabun" font-weight="700" font-size="12" fill="#c66a00">เสริมใหม่</text><text x="128" y="524" font-family="Sarabun" font-weight="700" font-size="17.5" fill="#132743">ขั้น 05 — AI จับคู่โอนย้ายภายใน</text><text x="128" y="550" font-family="Sarabun" font-size="14.5" fill="#3c4a5c">เทียบ Core Competency ปัจจุบันของสมาชิกกับงานที่เปิดโอนย้าย + ชี้เคส "คนนี้ fit งานอื่นมากกว่า"</text><rect x="128" y="573" width="1166" height="31" rx="7" fill="#eef4ff" stroke="#dbe8fa"/><text x="142" y="595" font-family="Sarabun" font-weight="700" font-size="13.8" fill="#0b62d6">ทำไมจึงต้องเสริม:</text><text x="302" y="595" font-family="Sarabun" font-size="13.8" fill="#1c3a5e">ลด 7 วันของขั้นตอนโอนย้ายที่ต้องเปิดไฟล์ข้อมูลเก่าทีละไฟล์ด้วยมือ</text><circle cx="70" cy="648" r="24" fill="#e8930c"/><text x="70" y="655" text-anchor="middle" font-family="Sarabun" font-weight="700" font-size="19" fill="#fff">D</text><rect x="106" y="622" width="1210" height="122" rx="12" fill="#fff" stroke="#f0c987" stroke-width="2" filter="url(#soft)"/><rect x="1203" y="635" width="93" height="25" rx="12" fill="#fff7ea" stroke="#e8930c" stroke-width="1.3"/><text x="1249.5" y="652" text-anchor="middle" font-family="Sarabun" font-weight="700" font-size="12" fill="#c66a00">เสริมใหม่</text><text x="128" y="660" font-family="Sarabun" font-weight="700" font-size="17.5" fill="#132743">ขั้น 10-11 — AI สรุป Executive Summary หน้าเดียว ให้ HITL ตัดสินไว</text><text x="128" y="686" font-family="Sarabun" font-size="14.5" fill="#3c4a5c">สรุปผู้สมัครแต่ละคนเป็นหน้าเดียว: ผลคัดกรอง / ตัวเลขทุกแบบทดสอบ / ธงเตือน / quote สำคัญ</text><rect x="128" y="709" width="1166" height="31" rx="7" fill="#eef4ff" stroke="#dbe8fa"/><text x="142" y="731" font-family="Sarabun" font-weight="700" font-size="13.8" fill="#0b62d6">ทำไมจึงต้องเสริม:</text><text x="302" y="731" font-family="Sarabun" font-size="13.8" fill="#1c3a5e">HITL Gate ที่ 10-11 มีเวลาแค่ 4 ชม. — decision-ready ทำให้ตัดสินเร็ว + ไม่ต้องเปิดเอกสารซ้อนหลายชั้น</text><circle cx="70" cy="784" r="24" fill="#e8930c"/><text x="70" y="791" text-anchor="middle" font-family="Sarabun" font-weight="700" font-size="19" fill="#fff">E</text><rect x="106" y="758" width="1210" height="122" rx="12" fill="#fff" stroke="#f0c987" stroke-width="2" filter="url(#soft)"/><rect x="1203" y="771" width="93" height="25" rx="12" fill="#fff7ea" stroke="#e8930c" stroke-width="1.3"/><text x="1249.5" y="788" text-anchor="middle" font-family="Sarabun" font-weight="700" font-size="12" fill="#c66a00">เสริมใหม่</text><text x="128" y="796" font-family="Sarabun" font-weight="700" font-size="17.5" fill="#132743">ผล 3E3P → AI แปลเป็นบทบาท/สไตล์การดูแลที่เหมาะ</text><text x="128" y="822" font-family="Sarabun" font-size="14.5" fill="#3c4a5c">แปลโปรไฟล์แรงจูงใจ 3E3P เป็นข้อเสนอบทบาทและสไตล์การดูแลของหัวหน้าที่ fit กับลักษณะคน</text><rect x="128" y="845" width="1166" height="31" rx="7" fill="#eef4ff" stroke="#dbe8fa"/><text x="142" y="867" font-family="Sarabun" font-weight="700" font-size="13.8" fill="#0b62d6">ทำไมจึงต้องเสริม:</text><text x="302" y="867" font-family="Sarabun" font-size="13.8" fill="#1c3a5e">ให้การจับคู่เป็น "เหมาะกับงาน + คน" ไม่ใช่แค่คุณสมบัติบนกระดาษ</text><circle cx="70" cy="920" r="24" fill="#e8930c"/><text x="70" y="927" text-anchor="middle" font-family="Sarabun" font-weight="700" font-size="19" fill="#fff">F</text><rect x="106" y="894" width="1210" height="122" rx="12" fill="#fff" stroke="#f0c987" stroke-width="2" filter="url(#soft)"/><rect x="1038" y="907" width="258" height="25" rx="12" fill="#fff7ea" stroke="#e8930c" stroke-width="1.3"/><text x="1167" y="924" text-anchor="middle" font-family="Sarabun" font-weight="700" font-size="12" fill="#c66a00">Web PP7 Task 6 (รอประชุม 7 ต.ค.)</text><text x="128" y="932" font-family="Sarabun" font-weight="700" font-size="17.5" fill="#132743">Chatbot ฝั่งผู้สมัคร + ลงทะเบียน + เห็นสถานะตัวเอง</text><text x="128" y="958" font-family="Sarabun" font-size="14.5" fill="#3c4a5c">Chatbot ตอบคำถามผู้สมัครบนหน้าเว็บ + ระบบลงทะเบียน + หน้าสถานะตนเอง (ต้องทำอะไรต่อบ้าง)</text><rect x="128" y="981" width="1166" height="31" rx="7" fill="#eef4ff" stroke="#dbe8fa"/><text x="142" y="1003" font-family="Sarabun" font-weight="700" font-size="13.8" fill="#0b62d6">ทำไมจึงต้องเสริม:</text><text x="302" y="1003" font-family="Sarabun" font-size="13.8" fill="#1c3a5e">ตามสั่งพี่ปกรณ์ 1 ต.ค. 69 — ผูกแผนนี้กับ Web PP7 Phase 2 ได้ทันทีเมื่ออนุมัติ</text></svg>