<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard ผู้สมัคร - PKG Recruitment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap');
        * { font-family: 'Prompt', sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .card-hover { transition: all 0.3s ease; }
        .card-hover:hover { transform: translateY(-3px); box-shadow: 0 10px 20px -5px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <i class="fas fa-building text-purple-600 text-2xl mr-3"></i>
                    <span class="font-bold text-xl text-gray-800">PKG Recruitment</span>
                </div>
                <div class="flex items-center space-x-4">
                    <button onclick="showChatbot()" class="relative text-gray-700 hover:text-purple-600 px-3 py-2 rounded-md text-sm font-medium">
                        <i class="fas fa-comments text-xl"></i>
                        <span class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">3</span>
                    </button>
                    <div class="flex items-center space-x-2">
                        <div class="w-8 h-8 bg-purple-600 rounded-full flex items-center justify-center text-white font-semibold">
                            <span id="userAvatar">U</span>
                        </div>
                        <span id="userName" class="text-gray-700 font-medium">ผู้ใช้</span>
                    </div>
                    <button onclick="logout()" class="text-gray-700 hover:text-red-600 px-3 py-2 rounded-md text-sm font-medium">
                        <i class="fas fa-sign-out-alt mr-1"></i>ออกจากระบบ
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Welcome Section -->
        <div class="bg-gradient-to-r from-purple-600 to-indigo-600 rounded-xl p-8 text-white mb-8">
            <h1 class="text-3xl font-bold mb-2">สวัสดี, <span id="welcomeName">ผู้ใช้</span>!</h1>
            <p class="opacity-90">ยินดีต้อนรับสู่ระบบรับสมัครงาน PKG Group</p>
        </div>

        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white rounded-xl shadow-lg p-6 card-hover">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm mb-1">ใบสมัครทั้งหมด</p>
                        <p class="text-3xl font-bold text-gray-800" id="totalApplications">0</p>
                    </div>
                    <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-file-alt text-blue-600 text-xl"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-lg p-6 card-hover">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm mb-1">กำลังดำเนินการ</p>
                        <p class="text-3xl font-bold text-orange-600" id="pendingApplications">0</p>
                    </div>
                    <div class="w-12 h-12 bg-orange-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-clock text-orange-600 text-xl"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-lg p-6 card-hover">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm mb-1">แบบทดสอบ</p>
                        <p class="text-3xl font-bold text-purple-600" id="pendingTests">0</p>
                    </div>
                    <div class="w-12 h-12 bg-purple-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-tasks text-purple-600 text-xl"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-lg p-6 card-hover">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm mb-1">การแจ้งเตือน</p>
                        <p class="text-3xl font-bold text-red-600" id="notifications">0</p>
                    </div>
                    <div class="w-12 h-12 bg-red-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-bell text-red-600 text-xl"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Applications Section -->
        <div class="bg-white rounded-xl shadow-lg p-6 mb-8">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-800">
                    <i class="fas fa-briefcase text-purple-600 mr-2"></i>ใบสมัครของฉัน
                </h2>
                <button onclick="window.location.href='positions.html'" 
                        class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700 transition">
                    <i class="fas fa-plus mr-2"></i>สมัครงานใหม่
                </button>
            </div>
            <div id="applicationsList" class="space-y-4">
                <!-- Applications will be loaded here -->
            </div>
            <div id="noApplications" class="hidden text-center py-12">
                <i class="fas fa-inbox text-6xl text-gray-300 mb-4"></i>
                <p class="text-gray-500 text-lg mb-4">คุณยังไม่มีใบสมัคร</p>
                <button onclick="window.location.href='positions.html'" 
                        class="bg-purple-600 text-white px-6 py-3 rounded-lg hover:bg-purple-700 transition">
                    <i class="fas fa-search mr-2"></i>ดูตำแหน่งงาน
                </button>
            </div>
        </div>

        <!-- Notifications Section -->
        <div class="bg-white rounded-xl shadow-lg p-6">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">
                <i class="fas fa-bell text-purple-600 mr-2"></i>การแจ้งเตือน
            </h2>
            <div id="notificationsList" class="space-y-3">
                <!-- Notifications will be loaded here -->
            </div>
            <div id="noNotifications" class="hidden text-center py-8">
                <i class="fas fa-bell-slash text-4xl text-gray-300 mb-3"></i>
                <p class="text-gray-500">ไม่มีการแจ้งเตือน</p>
            </div>
        </div>
    </div>

    <!-- Chatbot Modal -->
    <div id="chatbotModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-end justify-end p-4">
        <div class="bg-white rounded-xl w-full max-w-md h-[600px] flex flex-col shadow-2xl">
            <div class="gradient-bg text-white p-4 rounded-t-xl flex justify-between items-center">
                <div class="flex items-center">
                    <i class="fas fa-robot text-2xl mr-3"></i>
                    <div>
                        <h3 class="font-bold">PKG Assistant</h3>
                        <p class="text-sm opacity-90">พร้อมช่วยเหลือคุณ</p>
                    </div>
                </div>
                <button onclick="closeChatbot()" class="text-white hover:text-gray-200">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div id="chatMessages" class="flex-1 overflow-y-auto p-4 space-y-3">
                <!-- Chat messages will be loaded here -->
            </div>
            <div class="border-t p-4">
                <div class="flex space-x-2">
                    <input type="text" id="chatInput" placeholder="พิมพ์ข้อความ..." 
                           class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-600"
                           onkeypress="if(event.key==='Enter')sendMessage()">
                    <button onclick="sendMessage()" class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/applicant-dashboard.js"></script>
</body>
</html>
